<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Windward</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101d2b;font-family:system-ui,sans-serif}body{display:grid;place-items:center}canvas{display:block;max-width:100vw;max-height:100vh;touch-action:none;cursor:crosshair}</style></head>
<body><canvas id="game" width="960" height="600" aria-label="Windward, a game about controlling the wind"></canvas><script>
(()=>{"use strict";
const canvas=document.getElementById("game"),c=canvas.getContext("2d"),W=960,H=600,TAU=Math.PI*2;
const garden={x:825,y:300,r:65},hearth={x:95,y:300,r:52};
let game,last=0,pointer={x:480,y:300,down:false,startX:480,startY:300},keys=new Set(),particles=[];
const random=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),length=(x,y)=>Math.hypot(x,y),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function reset(){game={mode:"title",time:120,planted:0,target:12,fires:0,maxFires:5,windX:0,windY:0,aimX:0,aimY:0,gust:100,pulse:0,seedClock:.8,emberClock:2.6,seeds:[],embers:[],message:"",messageTime:0,shake:0};particles=[];pointer.down=false}reset();
function note(message){game.message=message;game.messageTime=1.5}
function spark(x,y,color,count=12){for(let i=0;i<count;i++){const life=random(.25,.7);particles.push({x,y,vx:random(-105,105),vy:random(-105,105),life,maxLife:life,color,size:random(2,5)})}}
function seed(){game.seeds.push({x:random(175,385),y:random(70,530),vx:random(-12,12),vy:random(-12,12),age:0,phase:random(0,TAU),r:8})}
function ember(){game.embers.push({x:random(440,690),y:random(65,535),vx:random(-12,12),vy:random(-12,12),age:0,phase:random(0,TAU),r:7})}
function start(){reset();game.mode="play";for(let i=0;i<4;i++)seed()}
function pulse(){if(game.mode!=="play"||game.gust<40)return;if(length(game.windX,game.windY)<20){note("Aim the wind first!");return}game.gust-=40;game.pulse=.28;game.shake=5;spark(480,300,"#d7faff",18)}
function position(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
canvas.addEventListener("pointerdown",e=>{e.preventDefault();const p=position(e);pointer.x=pointer.startX=p.x;pointer.y=pointer.startY=p.y;pointer.down=true;canvas.setPointerCapture(e.pointerId);if(game.mode!=="play")start()});
canvas.addEventListener("pointermove",e=>{const p=position(e);pointer.x=p.x;pointer.y=p.y});canvas.addEventListener("pointerup",()=>pointer.down=false);canvas.addEventListener("pointercancel",()=>pointer.down=false);
window.addEventListener("keydown",e=>{const key=e.key.toLowerCase();keys.add(key);if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(key))e.preventDefault();if(key==="enter"&&game.mode!=="play")start();if(key===" "&&!e.repeat)pulse();if(key==="p"&&game.mode==="play")game.mode="pause";else if(key==="p"&&game.mode==="pause")game.mode="play"});
window.addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));window.addEventListener("blur",()=>{keys.clear();pointer.down=false;if(game.mode==="play")game.mode="pause"});
function windAt(obj){let x=game.windX,y=game.windY;if(keys.has("shift")&&game.gust>0){const dx=obj.x-pointer.x,dy=obj.y-pointer.y,d=Math.max(25,length(dx,dy)),influence=clamp(1-d/205,0,1);x+=(-dy/d*235-dx/d*70)*influence;y+=(dx/d*235-dy/d*70)*influence}if(game.pulse>0){x*=2.9;y*=2.9}return{x,y}}
function moveObject(o,dt,isEmber){o.age+=dt;const wind=windAt(o),response=isEmber?.55:.85,driftX=isEmber?-13:8,driftY=Math.sin(o.age*2.4+o.phase)*10;o.vx+=(wind.x*response+driftX-o.vx)*Math.min(1,dt*2.1);o.vy+=(wind.y*response+driftY-o.vy)*Math.min(1,dt*2.1);o.x+=o.vx*dt;o.y+=o.vy*dt;if(o.y<34){o.y=34;o.vy=Math.abs(o.vy)*.55}if(o.y>H-34){o.y=H-34;o.vy=-Math.abs(o.vy)*.55}}
function update(dt){game.shake=Math.max(0,game.shake-dt*22);game.messageTime=Math.max(0,game.messageTime-dt);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.max(0,1-dt*2);p.vy*=Math.max(0,1-dt*2);p.life-=dt}particles=particles.filter(p=>p.life>0);if(game.mode!=="play")return;game.time-=dt;if(game.time<=0){game.time=0;game.mode="lose";note("The garden ran out of time.");return}
let ax=0,ay=0;if(keys.has("arrowleft")||keys.has("a"))ax--;if(keys.has("arrowright")||keys.has("d"))ax++;if(keys.has("arrowup")||keys.has("w"))ay--;if(keys.has("arrowdown")||keys.has("s"))ay++;if(pointer.down){ax=pointer.x-pointer.startX;ay=pointer.y-pointer.startY;const drag=length(ax,ay),strength=clamp(drag/95,0,1);if(drag>4){ax=ax/drag*strength;ay=ay/drag*strength}else ax=ay=0}else{const n=length(ax,ay);if(n){ax/=n;ay/=n}}game.aimX=ax*185;game.aimY=ay*185;game.windX+=(game.aimX-game.windX)*Math.min(1,dt*5);game.windY+=(game.aimY-game.windY)*Math.min(1,dt*5);
if(keys.has("shift")&&game.gust>0)game.gust=Math.max(0,game.gust-dt*24);else game.gust=Math.min(100,game.gust+dt*13);game.pulse=Math.max(0,game.pulse-dt);game.seedClock-=dt;if(game.seedClock<=0&&game.seeds.length<8){seed();game.seedClock=random(1.8,2.8)}game.emberClock-=dt;if(game.emberClock<=0&&game.embers.length<9){ember();game.emberClock=random(2.3,3.3)}
for(const s of game.seeds){moveObject(s,dt,false);if(dist(s,garden)<garden.r-10){s.done=true;game.planted++;game.gust=Math.min(100,game.gust+12);spark(s.x,s.y,"#e8f9a2",16);note("Seed planted! +12 gust")}else if(s.x>W+25||s.x< -25)s.done=true}
for(const e of game.embers){moveObject(e,dt,true);if(dist(e,garden)<garden.r-8){e.done=true;game.fires++;game.shake=9;spark(e.x,e.y,"#ff814f",24);note("The garden caught fire!")}else if(e.x< -25||e.x>W+25){e.done=true;if(e.x>W){game.gust=Math.min(100,game.gust+5);spark(W-8,e.y,"#ffc17c",6)}}}
for(const e of game.embers){if(e.done)continue;for(const s of game.seeds){if(!s.done&&dist(e,s)<e.r+s.r+3){e.done=true;s.done=true;spark(s.x,s.y,"#ffb36d",13);note("An ember burned a seed!");break}}}game.seeds=game.seeds.filter(s=>!s.done);game.embers=game.embers.filter(e=>!e.done);if(game.planted>=game.target)game.mode="win";else if(game.fires>=game.maxFires)game.mode="lose"}
function label(text,x,y,size=16,color="#e8f5f5",align="left",weight=500){c.fillStyle=color;c.font=`${weight} ${size}px system-ui`;c.textAlign=align;c.textBaseline="middle";c.fillText(text,x,y)}
function rounded(x,y,w,h,r,color){c.fillStyle=color;c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}
function drawBackdrop(t){const bg=c.createLinearGradient(0,0,W,H);bg.addColorStop(0,"#153449");bg.addColorStop(1,"#24495a");c.fillStyle=bg;c.fillRect(0,0,W,H);c.strokeStyle="#ffffff0d";c.lineWidth=1;for(let y=45;y<H;y+=45){c.beginPath();for(let x=0;x<=W;x+=18){const yy=y+Math.sin(x*.018+t*.5+y)*4;if(x===0)c.moveTo(x,yy);else c.lineTo(x,yy)}c.stroke()}
c.fillStyle="#42644f";c.beginPath();c.arc(hearth.x,hearth.y,hearth.r+19,0,TAU);c.fill();c.fillStyle="#274438";c.beginPath();c.arc(hearth.x,hearth.y,hearth.r,0,TAU);c.fill();for(let i=0;i<9;i++){const a=i*TAU/9+.2,x=hearth.x+Math.cos(a)*35,y=hearth.y+Math.sin(a)*35;c.strokeStyle="#b5d47c";c.lineWidth=2;c.beginPath();c.moveTo(x,y+7);c.lineTo(x,y-7);c.stroke();c.fillStyle="#e9f4af";c.beginPath();c.arc(x,y-9,4,0,TAU);c.fill()}
c.fillStyle="#7eb68a";c.beginPath();c.arc(garden.x,garden.y,garden.r+14,0,TAU);c.fill();c.fillStyle="#294f43";c.beginPath();c.arc(garden.x,garden.y,garden.r,0,TAU);c.fill();for(let i=0;i<10;i++){const a=i*2.4,radius=12+Math.sqrt(i)*13,x=garden.x+Math.cos(a)*radius,y=garden.y+Math.sin(a)*radius;c.fillStyle=i<game.planted?"#f6dc82":"#62896b";c.beginPath();c.arc(x,y,5,0,TAU);c.fill()}label("SEED GROVE",hearth.x,382,13,"#d7efb8","center",700);label("GARDEN",garden.x,394,13,"#e0f7d7","center",700);
const wx=game.windX,wy=game.windY,magnitude=length(wx,wy);if(magnitude>7){const nx=wx/magnitude,ny=wy/magnitude;c.strokeStyle=game.pulse>0?"#e4ffff8c":"#c6f6f64d";c.lineWidth=game.pulse>0?3:2;for(let i=0;i<23;i++){const x=((i*149+t*magnitude*.8)%(W+100))-50,y=54+(i*83)%(H-105);c.beginPath();c.moveTo(x,y);c.lineTo(x+nx*(17+magnitude*.11),y+ny*(17+magnitude*.11));c.stroke()}}}
function drawSeed(s,t){const bob=Math.sin(t*3+s.phase)*2;c.save();c.translate(s.x,s.y+bob);c.rotate(Math.atan2(s.vy,s.vx)+Math.PI/2);c.strokeStyle="#e8f5c1";c.lineWidth=1.5;for(let i=-2;i<=2;i++){c.beginPath();c.moveTo(0,3);c.lineTo(i*5,-12+Math.abs(i)*2);c.stroke()}c.fillStyle="#f6e4a3";c.beginPath();c.ellipse(0,6,3,6,0,0,TAU);c.fill();c.restore()}
function drawEmber(e,t){const glow=11+Math.sin(t*9+e.phase)*2,g=c.createRadialGradient(e.x,e.y,1,e.x,e.y,glow*2.3);g.addColorStop(0,"#ffdf86a0");g.addColorStop(1,"#ff733000");c.fillStyle=g;c.beginPath();c.arc(e.x,e.y,glow*2.3,0,TAU);c.fill();c.fillStyle="#ff9b53";c.beginPath();c.arc(e.x,e.y,e.r,0,TAU);c.fill();c.fillStyle="#fff0ac";c.beginPath();c.arc(e.x-2,e.y-2,2.5,0,TAU);c.fill()}
function drawControls(t){if(pointer.down&&game.mode==="play"){c.strokeStyle="#e2ffffa8";c.lineWidth=3;c.beginPath();c.arc(pointer.startX,pointer.startY,18,0,TAU);c.stroke();c.beginPath();c.moveTo(pointer.startX,pointer.startY);c.lineTo(pointer.x,pointer.y);c.stroke();c.fillStyle="#e2ffff";c.beginPath();c.arc(pointer.x,pointer.y,6,0,TAU);c.fill()}if(keys.has("shift")&&game.mode==="play"&&game.gust>0){c.strokeStyle="#b7efff99";c.lineWidth=2;for(let i=0;i<3;i++){c.beginPath();c.arc(pointer.x,pointer.y,24+i*27,t*2+i,t*2+i+Math.PI*1.25);c.stroke()}}}
function drawHUD(){rounded(18,15,924,62,14,"#10232bdc");label(`SEEDS  ${game.planted}/${game.target}`,36,45,19,"#e7f6b1","left",800);label(`FIRES  ${game.fires}/${game.maxFires}`,263,45,19,"#ffae83","left",800);label(`TIME  ${Math.ceil(game.time)}s`,490,45,19,game.time<20?"#ff8d7c":"#e8f5f5","left",800);label("GUST",708,45,14,"#d4eff6","left",700);rounded(762,37,154,16,8,"#34515b");rounded(762,37,154*game.gust/100,16,8,"#9ee7ee");if(game.messageTime>0&&game.mode==="play"){rounded(285,91,390,37,10,"#10232be8");label(game.message,480,110,16,"#fff0c4","center",700)}rounded(165,553,630,31,10,"#10232bd5");label("Drag: steer wind    •    Arrows/WASD: steer    •    Space: gust    •    Shift: vortex    •    P: pause",480,569,13,"#d5e9ed","center",600)}
function overlay(title,lines,action){c.fillStyle="#081923d9";c.fillRect(0,0,W,H);rounded(180,123,600,354,22,"#183543");c.strokeStyle="#8bc7c9";c.lineWidth=2;c.beginPath();c.roundRect(180,123,600,354,22);c.stroke();label(title,480,177,38,"#f3e7ae","center",800);lines.forEach((line,i)=>label(line,480,244+i*36,17,"#d7ebed","center",500));rounded(333,397,294,49,12,"#427e82");label(action,480,421,18,"#ffffff","center",800)}
function draw(t){c.save();if(game.shake>0)c.translate(random(-game.shake,game.shake),random(-game.shake,game.shake));drawBackdrop(t);for(const s of game.seeds)drawSeed(s,t);for(const e of game.embers)drawEmber(e,t);for(const p of particles){c.globalAlpha=clamp(p.life/p.maxLife,0,1);c.fillStyle=p.color;c.beginPath();c.arc(p.x,p.y,p.size,0,TAU);c.fill()}c.globalAlpha=1;drawControls(t);drawHUD();c.restore();if(game.mode==="title")overlay("WINDWARD",["You are the wind. Carry 12 seeds from the grove to the garden.","Keep glowing embers out: five garden fires end the run.","Drag to blow. Space blasts. Hold Shift to swirl air around your pointer.","Seeds are light; embers are heavier. You have two minutes."],"Click or press Enter to begin");else if(game.mode==="pause")overlay("PAUSED",["The breeze is waiting.","Try a vortex to catch seeds or deflect approaching embers."],"Press P to resume");else if(game.mode==="win")overlay("THE GARDEN BLOOMS",[`You planted ${game.planted} seeds with ${Math.ceil(game.time)} seconds left.`,`Garden fires: ${game.fires}/${game.maxFires}.`],"Click or press Enter to play again");else if(game.mode==="lose")overlay("THE WIND FADES",[game.fires>=game.maxFires?"Too many embers reached the garden.":"Time ran out before the garden could bloom.",`You planted ${game.planted} of ${game.target} seeds.`],"Click or press Enter to try again")}
function fit(){const scale=Math.min(innerWidth/W,innerHeight/H);canvas.style.width=`${W*scale}px`;canvas.style.height=`${H*scale}px`}window.addEventListener("resize",fit);fit();function frame(now){const dt=Math.min((now-last)/1000||0,.05);last=now;update(dt);draw(now/1000);requestAnimationFrame(frame)}requestAnimationFrame(frame)
})();
</script></body></html>

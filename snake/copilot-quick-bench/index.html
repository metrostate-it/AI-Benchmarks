<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column}
canvas{background:#1a1a1a;border:3px solid #4caf50}
#info{margin:10px;font-size:20px}
button{padding:10px 18px;border:none;border-radius:8px;background:#4caf50;color:white;cursor:pointer}
</style>
</head>
<body>
<h1>Snake Game</h1>
<div id="info">Score: <span id="score">0</span></div>
<canvas id="game" width="400" height="400"></canvas>
<p>Use Arrow Keys to Move</p>
<button onclick="restart()">Restart</button>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const box=20;
let snake=[{x:200,y:200}];
let dx=box,dy=0;
let score=0;
let food=randomFood();
function randomFood(){
 return {x:Math.floor(Math.random()*20)*box,y:Math.floor(Math.random()*20)*box};
}
function draw(){
 ctx.fillStyle='#1a1a1a';
 ctx.fillRect(0,0,400,400);
 ctx.fillStyle='red';
 ctx.fillRect(food.x,food.y,box,box);
 ctx.fillStyle='#4caf50';
 snake.forEach(s=>ctx.fillRect(s.x,s.y,box-2,box-2));
 let head={x:snake[0].x+dx,y:snake[0].y+dy};
 if(head.x===food.x&&head.y===food.y){
   score++;
   document.getElementById('score').textContent=score;
   food=randomFood();
 } else snake.pop();
 if(head.x<0||head.y<0||head.x>=400||head.y>=400||snake.some((s,i)=>i&&s.x===head.x&&s.y===head.y)){
   alert('Game Over! Score: '+score);
   restart();
   return;
 }
 snake.unshift(head);
}
function restart(){
 snake=[{x:200,y:200}];dx=box;dy=0;score=0;food=randomFood();
 document.getElementById('score').textContent=0;
}
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowUp'&&dy===0){dx=0;dy=-box;}
 else if(e.key==='ArrowDown'&&dy===0){dx=0;dy=box;}
 else if(e.key==='ArrowLeft'&&dx===0){dx=-box;dy=0;}
 else if(e.key==='ArrowRight'&&dx===0){dx=box;dy=0;}
});
setInterval(draw,120);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh}
canvas{background:#1b1b1b;border:3px solid #4caf50;box-shadow:0 0 20px rgba(76,175,80,.5)}
h1{margin:8px}#score{margin:8px;font-size:20px}.info{opacity:.8}
</style>
</head>
<body>
<h1>Snake</h1>
<div id="score">Score: 0</div>
<canvas id="game" width="400" height="400"></canvas>
<div class="info">Use Arrow Keys or WASD. Press Space to restart.</div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const box=20;
const tiles=20;
let snake,food,dx,dy,score,gameOver;
function reset(){snake=[{x:10,y:10}];dx=1;dy=0;score=0;gameOver=false;spawnFood();document.getElementById('score').textContent='Score: '+score;}
function spawnFood(){do{food={x:Math.floor(Math.random()*tiles),y:Math.floor(Math.random()*tiles)};}while(snake.some(s=>s.x===food.x&&s.y===food.y));}
function draw(){ctx.fillStyle='#1b1b1b';ctx.fillRect(0,0,400,400);ctx.fillStyle='red';ctx.fillRect(food.x*box,food.y*box,box,box);ctx.fillStyle='#4caf50';snake.forEach((s,i)=>{ctx.fillRect(s.x*box,s.y*box,box-1,box-1);});if(gameOver){ctx.fillStyle='white';ctx.font='32px Arial';ctx.fillText('Game Over',105,190);ctx.font='18px Arial';ctx.fillText('Press Space',145,225);} }
function update(){if(gameOver)return;const head={x:snake[0].x+dx,y:snake[0].y+dy};if(head.x<0||head.y<0||head.x>=tiles||head.y>=tiles||snake.some(s=>s.x===head.x&&s.y===head.y)){gameOver=true;draw();return;}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score++;document.getElementById('score').textContent='Score: '+score;spawnFood();}else{snake.pop();}draw();}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if((k==='arrowup'||k==='w')&&dy!==1){dx=0;dy=-1;}else if((k==='arrowdown'||k==='s')&&dy!==-1){dx=0;dy=1;}else if((k==='arrowleft'||k==='a')&&dx!==1){dx=-1;dy=0;}else if((k==='arrowright'||k==='d')&&dx!==-1){dx=1;dy=0;}else if(k===' '&&gameOver){reset();}});
reset();draw();setInterval(update,120);
</script>
</body>
</html>

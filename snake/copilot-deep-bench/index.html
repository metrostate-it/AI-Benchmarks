<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Snake</title>
  <style>
    :root {
      --bg: #050816;
      --panel: rgba(15, 23, 42, 0.82);
      --line: rgba(148, 163, 184, 0.15);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --snake: #22d3ee;
      --snake-head: #67e8f9;
      --food: #fb7185;
      --accent: #8b5cf6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      overflow: hidden;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(34, 211, 238, 0.15), transparent 32%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.18), transparent 34%),
        var(--bg);
    }

    .game-shell {
      width: min(94vw, 620px);
      padding: 22px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 26px;
      background: var(--panel);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: clamp(1.55rem, 5vw, 2.2rem);
      letter-spacing: -0.04em;
    }

    .title-wrap p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .scores { display: flex; gap: 10px; }

    .score-card {
      min-width: 76px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      text-align: center;
      background: rgba(2, 6, 23, 0.55);
    }

    .score-card span {
      display: block;
      color: var(--muted);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .score-card strong { font-size: 1.18rem; }

    .board-wrap {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(34, 211, 238, 0.22);
      border-radius: 20px;
      background: #020617;
      box-shadow: inset 0 0 35px rgba(34, 211, 238, 0.05);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background: rgba(2, 6, 23, 0.64);
      backdrop-filter: blur(5px);
      transition: opacity 160ms ease;
    }

    .overlay.hidden { opacity: 0; pointer-events: none; }

    .overlay-card {
      max-width: 350px;
      padding: 26px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.92);
      box-shadow: 0 18px 48px rgba(0,0,0,0.35);
    }

    .overlay h2 { margin: 0 0 7px; font-size: 1.75rem; }
    .overlay p { margin: 0 0 18px; color: var(--muted); line-height: 1.5; }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 18px;
      color: white;
      font-weight: 750;
      cursor: pointer;
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      box-shadow: 0 8px 25px rgba(34, 211, 238, 0.22);
    }

    button:hover { filter: brightness(1.1); }
    button:active { transform: translateY(1px); }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 15px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .status { display: flex; align-items: center; gap: 7px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 12px #22c55e; }

    .mobile-controls {
      display: none;
      width: 184px;
      margin: 16px auto 0;
      grid-template-columns: repeat(3, 54px);
      gap: 8px;
      justify-content: center;
    }

    .mobile-controls button {
      width: 54px;
      height: 48px;
      padding: 0;
      font-size: 1.1rem;
      background: rgba(30, 41, 59, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: none;
    }

    .mobile-controls .up { grid-column: 2; }
    .mobile-controls .left { grid-column: 1; grid-row: 2; }
    .mobile-controls .down { grid-column: 2; grid-row: 2; }
    .mobile-controls .right { grid-column: 3; grid-row: 2; }

    @media (max-width: 640px), (pointer: coarse) {
      body { overflow: auto; padding: 10px; }
      .game-shell { padding: 14px; border-radius: 20px; }
      header { align-items: flex-start; }
      .title-wrap p { display: none; }
      .score-card { min-width: 62px; padding: 8px; }
      .mobile-controls { display: grid; }
      .footer { justify-content: center; }
      .footer > :last-child { display: none; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header>
      <div class="title-wrap">
        <h1>Neon Snake</h1>
        <p>Eat, grow, and do not hit the walls.</p>
      </div>
      <div class="scores">
        <div class="score-card"><span>Score</span><strong id="score">0</strong></div>
        <div class="score-card"><span>Best</span><strong id="best">0</strong></div>
      </div>
    </header>

    <section class="board-wrap">
      <canvas id="game" width="600" height="600" aria-label="Snake game board"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <h2 id="overlayTitle">Ready?</h2>
          <p id="overlayText">Use the arrow keys or WASD. Press Space to pause.</p>
          <button id="startButton">Start Game</button>
        </div>
      </div>
    </section>

    <div class="mobile-controls" aria-label="Touch controls">
      <button class="up" data-dir="up" aria-label="Move up">▲</button>
      <button class="left" data-dir="left" aria-label="Move left">◀</button>
      <button class="down" data-dir="down" aria-label="Move down">▼</button>
      <button class="right" data-dir="right" aria-label="Move right">▶</button>
    </div>

    <div class="footer">
      <div class="status"><span class="dot"></span><span id="status">Waiting to start</span></div>
      <span>Arrow keys / WASD • Space to pause</span>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const statusEl = document.getElementById('status');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayText = document.getElementById('overlayText');
    const startButton = document.getElementById('startButton');

    const cells = 24;
    const cell = canvas.width / cells;
    let snake, food, direction, queuedDirection, score, running, paused, timer;
    let best = Number(localStorage.getItem('neonSnakeBest') || 0);
    bestEl.textContent = best;

    function randomFood() {
      let position;
      do {
        position = {
          x: Math.floor(Math.random() * cells),
          y: Math.floor(Math.random() * cells)
        };
      } while (snake.some(part => part.x === position.x && part.y === position.y));
      return position;
    }

    function resetGame() {
      snake = [{ x: 12, y: 12 }, { x: 11, y: 12 }, { x: 10, y: 12 }];
      direction = { x: 1, y: 0 };
      queuedDirection = { ...direction };
      score = 0;
      scoreEl.textContent = score;
      food = randomFood();
      paused = false;
      draw();
    }

    function startGame() {
      clearTimeout(timer);
      resetGame();
      running = true;
      overlay.classList.add('hidden');
      statusEl.textContent = 'Game in progress';
      tick();
    }

    function tick() {
      if (!running || paused) return;
      direction = queuedDirection;
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      const hitWall = head.x < 0 || head.x >= cells || head.y < 0 || head.y >= cells;
      const hitSelf = snake.some(part => part.x === head.x && part.y === head.y);
      if (hitWall || hitSelf) return gameOver();

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        food = randomFood();
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem('neonSnakeBest', best);
        }
      } else {
        snake.pop();
      }

      draw();
      const speed = Math.max(62, 125 - score * 3);
      timer = setTimeout(tick, speed);
    }

    function gameOver() {
      running = false;
      clearTimeout(timer);
      statusEl.textContent = 'Game over';
      overlayTitle.textContent = 'Game Over';
      overlayText.textContent = `You scored ${score}. Your best is ${best}.`;
      startButton.textContent = 'Play Again';
      overlay.classList.remove('hidden');
    }

    function togglePause() {
      if (!running) return;
      paused = !paused;
      if (paused) {
        clearTimeout(timer);
        statusEl.textContent = 'Paused';
        overlayTitle.textContent = 'Paused';
        overlayText.textContent = 'Press Space or use the button to continue.';
        startButton.textContent = 'Resume';
        overlay.classList.remove('hidden');
      } else {
        overlay.classList.add('hidden');
        statusEl.textContent = 'Game in progress';
        tick();
      }
    }

    function setDirection(x, y) {
      if (!running) return;
      if (x === -direction.x && y === -direction.y) return;
      queuedDirection = { x, y };
    }

    function drawRoundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fill();
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(148, 163, 184, 0.055)';
      ctx.lineWidth = 1;
      for (let i = 1; i < cells; i++) {
        ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(canvas.width, i * cell); ctx.stroke();
      }

      const pulse = 2 + Math.sin(Date.now() / 180) * 2;
      ctx.shadowColor = '#fb7185';
      ctx.shadowBlur = 18 + pulse;
      ctx.fillStyle = '#fb7185';
      ctx.beginPath();
      ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, cell * 0.31, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      snake.forEach((part, index) => {
        const inset = index === 0 ? 2.5 : 3.5;
        ctx.fillStyle = index === 0 ? '#67e8f9' : `hsl(${188 + Math.min(index, 30)}, 82%, ${57 - Math.min(index, 25) * 0.6}%)`;
        ctx.shadowColor = '#22d3ee';
        ctx.shadowBlur = index < 4 ? 13 : 5;
        drawRoundedRect(part.x * cell + inset, part.y * cell + inset, cell - inset * 2, cell - inset * 2, 7);
      });
      ctx.shadowBlur = 0;

      const head = snake[0];
      if (head) {
        ctx.fillStyle = '#05202b';
        const perp = { x: -direction.y, y: direction.x };
        const front = { x: direction.x * 4, y: direction.y * 4 };
        [-1, 1].forEach(side => {
          ctx.beginPath();
          ctx.arc(
            head.x * cell + cell / 2 + perp.x * side * 6 + front.x,
            head.y * cell + cell / 2 + perp.y * side * 6 + front.y,
            2.5, 0, Math.PI * 2
          );
          ctx.fill();
        });
      }
    }

    document.addEventListener('keydown', event => {
      const key = event.key.toLowerCase();
      if (['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d',' '].includes(key)) event.preventDefault();
      if (key === 'arrowup' || key === 'w') setDirection(0, -1);
      if (key === 'arrowdown' || key === 's') setDirection(0, 1);
      if (key === 'arrowleft' || key === 'a') setDirection(-1, 0);
      if (key === 'arrowright' || key === 'd') setDirection(1, 0);
      if (key === ' ') togglePause();
      if (key === 'enter' && !running) startGame();
    });

    document.querySelectorAll('[data-dir]').forEach(button => {
      button.addEventListener('pointerdown', () => {
        const dir = button.dataset.dir;
        if (dir === 'up') setDirection(0, -1);
        if (dir === 'down') setDirection(0, 1);
        if (dir === 'left') setDirection(-1, 0);
        if (dir === 'right') setDirection(1, 0);
      });
    });

    let touchStart = null;
    canvas.addEventListener('pointerdown', e => { touchStart = { x: e.clientX, y: e.clientY }; });
    canvas.addEventListener('pointerup', e => {
      if (!touchStart) return;
      const dx = e.clientX - touchStart.x;
      const dy = e.clientY - touchStart.y;
      if (Math.max(Math.abs(dx), Math.abs(dy)) > 18) {
        Math.abs(dx) > Math.abs(dy) ? setDirection(Math.sign(dx), 0) : setDirection(0, Math.sign(dy));
      }
      touchStart = null;
    });

    startButton.addEventListener('click', () => paused ? togglePause() : startGame());
    resetGame();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thermal Siege</title>
<style>
:root{
  --bg:#0a0d12; --panel:#141922; --panel2:#1b2230; --line:#2a3445; --text:#e6e9ef; --dim:#8b95a7;
  --gold:#f5c542; --life:#ff5d6c; --accent:#5ec8ff; --good:#5fd38d; --warn:#ffb347; --bad:#ff5d5d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#wrap{position:absolute;left:50%;top:50%;width:1240px;height:640px;display:flex;transform:translate(-50%,-50%);box-shadow:0 20px 60px rgba(0,0,0,.6);border-radius:10px;overflow:hidden}
#game{position:relative;width:960px;height:640px;flex:none}
#c{display:block;width:960px;height:640px;cursor:crosshair}
#panel{width:280px;height:640px;background:var(--panel);border-left:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 7px}
.stat .lbl{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.stat .val{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.gold{color:var(--gold)}.life{color:var(--life)}.wv{color:var(--accent)}
.sect{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:-3px}
.build{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.tb{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 0 2px;cursor:pointer;color:var(--text);display:flex;flex-direction:column;align-items:center;font:inherit;transition:border-color .12s,transform .08s}
.tb:hover{border-color:#4a5a75}
.tb:active{transform:scale(.96)}
.tb.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,0 0 12px rgba(94,200,255,.35)}
.tb.poor{opacity:.45}
.tb .cost{font-size:11px;color:var(--gold);font-weight:700}
.tb .key{position:absolute;top:1px;left:4px;font-size:9px;color:var(--dim)}
.info{flex:1;min-height:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:12px;line-height:1.4;overflow:hidden}
.ih{display:flex;align-items:center;gap:7px;font-size:14px;margin-bottom:4px}
.ih .lvl{margin-left:auto;color:var(--gold);font-size:12px;letter-spacing:1px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.role{color:#c5cbd6;margin-bottom:6px}
table.st{width:100%;border-collapse:collapse;margin:3px 0 5px}
table.st td{padding:1px 0}
table.st td:first-child{color:var(--dim)}
table.st td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--good)}
.perk{color:#ffd98a;font-size:11.5px;margin:3px 0}
.perk.dimp{color:#7d7560}
.gw{font-size:11.5px;margin:2px 0}
.gw b{font-weight:600}
.heat{display:flex;align-items:center;gap:7px;margin:6px 0 2px}
.hb{flex:1;height:9px;background:#0d1118;border-radius:5px;overflow:hidden;border:1px solid #2a3445}
.hf{height:100%;width:0;border-radius:5px;transition:width .1s linear}
.heat span{font-size:11px;width:62px;text-align:right;font-variant-numeric:tabular-nums}
.dim{color:var(--dim);font-size:11px}
.btns{display:flex;gap:5px;margin-top:7px}
.btn{flex:1;background:#243049;border:1px solid #34476b;color:var(--text);border-radius:7px;padding:6px 4px;font:inherit;font-size:12px;cursor:pointer;line-height:1.2}
.btn:hover:not(:disabled){background:#2c3b5a}
.btn:disabled{opacity:.4;cursor:default}
.btn.sell{background:#3a2426;border-color:#6a3439}
.btn.sell:hover{background:#4a2a2e}
.btn small{display:block;font-size:10px;color:var(--dim)}
.eg{display:grid;grid-template-columns:12px 1fr;gap:3px 7px;align-items:start;font-size:11.5px}
.eg .dot{margin-top:3px}
.mods{display:flex;flex-wrap:wrap;gap:4px;min-height:20px}
.chip{font-size:10.5px;padding:2px 7px;border-radius:10px;background:#22304a;border:1px solid #34476b;cursor:help}
.chip.trade{background:#3a2f1c;border-color:#6b5427}
.chip.none{background:none;border:none;color:var(--dim);padding:2px 0}
.next{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:11.5px;line-height:1.45}
.next b{color:var(--accent)}
.ctrls{display:flex;gap:6px}
.ctrls button{background:#243049;border:1px solid #34476b;color:var(--text);border-radius:8px;padding:9px 0;font:inherit;font-weight:600;cursor:pointer}
.ctrls button:hover:not(:disabled){background:#2c3b5a}
.ctrls button:disabled{opacity:.45;cursor:default}
#bWave{flex:1;background:linear-gradient(#2b7a4b,#236340);border-color:#3d9a63}
#bWave:hover:not(:disabled){background:linear-gradient(#32905a,#2a7449)}
#bSpeed,#bPause{width:46px}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,9,14,.72);backdrop-filter:blur(3px);z-index:5}
#ov.hidden{display:none}
.card{background:#141a24;border:1px solid #2e3a4f;border-radius:14px;padding:26px 30px;max-width:760px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h1{margin:0;font-size:46px;letter-spacing:.06em;background:linear-gradient(90deg,#5ec8ff,#ff7a45);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2{margin:0 0 6px;font-size:30px}
.card p{color:#c5cbd6;margin:8px 0}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0;text-align:left}
.cols div{background:#1b2230;border:1px solid #2a3445;border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.45;color:#c5cbd6}
.cols b{color:var(--text);display:block;margin-bottom:3px;font-size:13px}
.big{background:linear-gradient(#2b7a4b,#236340);border:1px solid #3d9a63;color:#fff;border-radius:10px;padding:11px 34px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;margin:6px 5px 0}
.big:hover{filter:brightness(1.15)}
.big.alt{background:#243049;border-color:#34476b}
.mcards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0 6px}
.mcard{background:#1b2230;border:1px solid #2e3a4f;border-radius:12px;padding:16px 14px;cursor:pointer;text-align:left;transition:transform .12s,border-color .12s,box-shadow .12s}
.mcard:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 8px 24px rgba(94,200,255,.18)}
.mcard .tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.mcard .tag.boon{color:var(--good)}.mcard .tag.trade{color:var(--warn)}
.mcard .nm{font-size:18px;font-weight:700;margin:5px 0 7px}
.mcard .ds{font-size:13px;color:#c5cbd6;line-height:1.45}
.mcard .ky{font-size:11px;color:var(--dim);margin-top:10px}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.sgrid div{background:#1b2230;border:1px solid #2a3445;border-radius:10px;padding:8px}
.sgrid b{display:block;font-size:22px}
.sgrid span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
kbd{background:#263146;border:1px solid #3a4a66;border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;font-family:inherit}
</style>
</head>
<body>
<div id="wrap">
  <div id="game">
    <canvas id="c"></canvas>
    <div id="ov"><div class="card" id="ovCard"></div></div>
  </div>
  <div id="panel">
    <div class="stats">
      <div class="stat"><span class="lbl">Gold</span><span class="val gold" id="sGold">0</span></div>
      <div class="stat"><span class="lbl">Lives</span><span class="val life" id="sLives">0</span></div>
      <div class="stat"><span class="lbl">Wave</span><span class="val wv" id="sWave">0/10</span></div>
    </div>
    <div class="sect">Build</div>
    <div class="build" id="build"></div>
    <div class="info" id="info"></div>
    <div class="sect">Modifiers</div>
    <div class="mods" id="mods"></div>
    <div class="next" id="next"></div>
    <div class="ctrls">
      <button id="bWave">Start Wave 1</button>
      <button id="bSpeed" title="Game speed (F)">1×</button>
      <button id="bPause" title="Pause (P)">❚❚</button>
    </div>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   THERMAL SIEGE — single-file canvas tower defense
   ===================================================================== */
const W = 960, H = 640, T = 40, COLS = 24, ROWS = 16;
const $ = id => document.getElementById(id);
const cvs = $('c'), ctx = cvs.getContext('2d');
const bgCanvas = document.createElement('canvas');
let RES = 1;

/* ---------- utils ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
function hexRgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function rgba(h,a){const[r,g,b]=hexRgb(h);return`rgba(${r},${g},${b},${a})`;}
function shade(h,f){const[r,g,b]=hexRgb(h);const m=v=>Math.round(f<0?v*(1+f):v+(255-v)*f);return`rgb(${m(r)},${m(g)},${m(b)})`;}
function lerpC(a,b,t){const A=hexRgb(a),B=hexRgb(b);return`rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`;}
function heatColor(f){return f<.5?lerpC('#5ec8ff','#ffd84a',f*2):lerpC('#ffd84a','#ff3b30',(f-.5)*2);}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function poly(g,n,r,rot=0){g.beginPath();for(let i=0;i<n;i++){const a=rot+i*Math.PI*2/n;g.lineTo(Math.cos(a)*r,Math.sin(a)*r);}g.closePath();}

/* ---------- path ---------- */
const WP = [[-1,2],[5,2],[5,7],[2,7],[2,12],[10,12],[10,4],[15,4],[15,13],[20,13],[20,3],[25,3]]
  .map(([c, r]) => ({ x: c * T + T / 2, y: r * T + T / 2 }));
const SEG = []; let PATH_LEN = 0;
for (let i = 0; i < WP.length - 1; i++) {
  const a = WP[i], b = WP[i + 1], len = Math.hypot(b.x - a.x, b.y - a.y);
  SEG.push({ a, b, len, start: PATH_LEN, dx: (b.x - a.x) / len, dy: (b.y - a.y) / len });
  PATH_LEN += len;
}
function posAt(d){
  if (d <= 0) { const s = SEG[0]; return { x: s.a.x + s.dx * d, y: s.a.y + s.dy * d, dx: s.dx, dy: s.dy }; }
  for (const s of SEG) if (d <= s.start + s.len) { const k = d - s.start; return { x: s.a.x + s.dx * k, y: s.a.y + s.dy * k, dx: s.dx, dy: s.dy }; }
  const s = SEG[SEG.length - 1]; return { x: s.b.x, y: s.b.y, dx: s.dx, dy: s.dy };
}
const pathTile = new Set();
for (const s of SEG) {
  const n = Math.ceil(s.len / 8);
  for (let i = 0; i <= n; i++) {
    const c = Math.floor((s.a.x + s.dx * s.len * i / n) / T), r = Math.floor((s.a.y + s.dy * s.len * i / n) / T);
    if (c >= 0 && c < COLS && r >= 0 && r < ROWS) pathTile.add(c + ',' + r);
  }
}

/* ---------- definitions ---------- */
const TOWERS = {
  gatling: { name:'Repeater', key:'1', color:'#f5c542', cost:60, upg:[70,110], cool:12,
    role:'Rapid-fire single-target gun. Every bullet is reduced by armor.',
    good:'Runners, Mites, Menders', weak:'Brutes & the Boss (armor)',
    lv:[{dmg:7,rate:5,range:110,heat:4.5},{dmg:10,rate:6.5,range:120,heat:4.2},{dmg:14,rate:8,range:135,heat:3.9,pierce:5}],
    perk:'Tungsten rounds: ignore 5 armor' },
  mortar: { name:'Mortar', key:'2', color:'#e8843a', cost:90, upg:[90,140], cool:9,
    role:'Lobbed shells with splash. Has a blind spot up close, and slow shells can miss fast targets.',
    good:'Packs, Splitters, Brutes', weak:'Runners (shells miss), targets too close',
    lv:[{dmg:32,rate:.55,range:165,min:55,splash:46,heat:14},{dmg:50,rate:.6,range:180,min:55,splash:54,heat:14},{dmg:72,rate:.7,range:195,min:55,splash:62,heat:13,burn:16}],
    perk:'Napalm: shells leave burning ground' },
  cryo: { name:'Cryo Spire', key:'3', color:'#7fe3ff', cost:70, upg:[70,100], cool:10,
    role:'Frost pulse slows everything in range. Chills adjacent towers: +35% cooling each.',
    good:'Runners, the Boss, supporting hot towers', weak:'Barely damages anything alone',
    lv:[{dmg:4,rate:.9,range:85,slow:.35,slowDur:1.6,heat:9},{dmg:7,rate:1,range:95,slow:.45,slowDur:1.8,heat:9},{dmg:11,rate:1.1,range:105,slow:.55,slowDur:2,heat:9,brittle:.2}],
    perk:'Brittle: chilled enemies take +20% damage' },
  lance: { name:'Prism Lance', key:'4', color:'#ff4fa3', cost:120, upg:[110,160], cool:10,
    role:'Continuous beam that ignores armor. Ramps up to ×4 damage while locked on one target. Runs very hot.',
    good:'Brutes, the Boss, anything tanky', weak:'Swarms (retargeting resets the ramp), heat',
    lv:[{dps:16,range:120,heat:26,ramp:1},{dps:24,range:130,heat:24,ramp:1},{dps:34,range:145,heat:22,ramp:1.5}],
    perk:'Focusing lens: ramps 50% faster' },
  tesla: { name:'Tesla Coil', key:'5', color:'#b18cff', cost:100, upg:[90,140], cool:10,
    role:'Lightning that chains between nearby enemies, losing 15% per jump. Armor applies to every jump.',
    good:'Packs, Mites, clustered Menders', weak:'Lone targets, heavy armor',
    lv:[{dmg:22,rate:1.1,range:100,chains:3,heat:12},{dmg:30,rate:1.25,range:110,chains:4,heat:12},{dmg:40,rate:1.4,range:120,chains:6,heat:11,stun:.35}],
    perk:'Overcharge: stuns the first target' }
};
const TKEYS = Object.keys(TOWERS);

const ENEMIES = {
  grunt:   { name:'Grunt',    hp:60,   speed:55,  armor:0,  bounty:6,   r:11, leak:1,  color:'#9bd35a', info:'Baseline infantry.' },
  runner:  { name:'Runner',   hp:34,   speed:118, armor:0,  bounty:5,   r:9,  leak:1,  color:'#5ec8ff', info:'Very fast. Slow it or out-gun it; mortar shells miss.' },
  brute:   { name:'Brute',    hp:190,  speed:36,  armor:8,  bounty:14,  r:14, leak:2,  color:'#a3acbd', info:'8 armor: subtracted from every hit. Use Mortar or Lance.' },
  splitter:{ name:'Splitter', hp:110,  speed:46,  armor:0,  bounty:8,   r:13, leak:2,  color:'#d17cff', info:'Bursts into 3 Mites. Splash or chains clean up.', split:3 },
  mite:    { name:'Mite',     hp:24,   speed:92,  armor:0,  bounty:1,   r:6,  leak:1,  color:'#ecb8ff', info:'' },
  mender:  { name:'Mender',   hp:130,  speed:48,  armor:2,  bounty:12,  r:12, leak:2,  color:'#5fd38d', info:'Heals nearby enemies. Kill it first.', heal:true },
  boss:    { name:'Colossus', hp:5200, speed:24,  armor:10, bounty:250, r:26, leak:99, color:'#ff5d6c', info:'Wave 10. Armored, spawns Mites, enrages at half HP.', boss:true }
};

const WAVES = [
  [{t:'grunt',n:10,i:1.1,d:0}],
  [{t:'grunt',n:10,i:1.0,d:0},{t:'runner',n:6,i:.8,d:6}],
  [{t:'grunt',n:8,i:.9,d:0},{t:'brute',n:3,i:3,d:4},{t:'runner',n:8,i:.5,d:12}],
  [{t:'splitter',n:6,i:2.2,d:0},{t:'grunt',n:10,i:.7,d:3}],
  [{t:'runner',n:14,i:.35,d:0},{t:'brute',n:4,i:2.5,d:6},{t:'mender',n:2,i:4,d:8}],
  [{t:'splitter',n:8,i:1.6,d:0},{t:'brute',n:6,i:2,d:4},{t:'grunt',n:12,i:.6,d:8}],
  [{t:'runner',n:22,i:.28,d:0},{t:'mender',n:4,i:2.5,d:3},{t:'brute',n:6,i:1.8,d:5}],
  [{t:'brute',n:10,i:1.5,d:0},{t:'splitter',n:8,i:1.4,d:3},{t:'mender',n:4,i:3,d:5}],
  [{t:'grunt',n:24,i:.4,d:0},{t:'runner',n:18,i:.3,d:6},{t:'brute',n:8,i:1.4,d:8},{t:'mender',n:5,i:2.4,d:10},{t:'splitter',n:8,i:1.3,d:12}],
  [{t:'brute',n:8,i:2,d:0},{t:'boss',n:1,i:1,d:6},{t:'mender',n:4,i:3,d:8},{t:'runner',n:20,i:.35,d:14},{t:'splitter',n:6,i:2,d:20}]
];
const waveHp = w => 1 + 0.15 * (w - 1) + 0.012 * (w - 1) ** 2;

function baseMods(){ return { dmg:1, range:1, rate:1, heat:1, cool:1, cost:1, refund:.6, bounty:1, enemyHp:1, enemySpeed:1,
  armor:0, waveBonus:0, interest:0, hitSlow:0, splash:1, chains:0, typeDmg:{} }; }
const MODS = [
  { id:'sinks', name:'Heat Sinks', kind:'boon', desc:'All towers cool 35% faster.', apply:M=>{M.cool*=1.35;} },
  { id:'reinf', name:'Reinforcements', kind:'boon', desc:'Gain 8 lives.', apply:()=>{S.lives+=8;} },
  { id:'chest', name:'War Chest', kind:'boon', desc:'Gain 175 gold right now.', apply:()=>{S.gold+=175;} },
  { id:'optics', name:'Precision Optics', kind:'boon', desc:'All towers gain +12% range.', apply:M=>{M.range*=1.12;} },
  { id:'overclock', name:'Overclock', kind:'trade', desc:'Towers fire 30% faster, but build heat 50% faster.', apply:M=>{M.rate*=1.3;M.heat*=1.5;} },
  { id:'bounty', name:'Bounty Contract', kind:'trade', desc:'+50% gold per kill, but enemies have +20% HP.', apply:M=>{M.bounty*=1.5;M.enemyHp*=1.2;} },
  { id:'firesale', name:'Fire Sale', kind:'trade', desc:'Towers and upgrades cost 20% less, but selling refunds only 30%.', apply:M=>{M.cost*=.8;M.refund=.3;} },
  { id:'glass', name:'Glass Cannon', kind:'trade', desc:'+35% damage for all towers, but −15% range.', apply:M=>{M.dmg*=1.35;M.range*=.85;} },
  { id:'interest', name:'Compound Interest', kind:'trade', desc:'Earn 15% of your unspent gold after each wave (max 100), but kills pay 25% less.', apply:M=>{M.interest=.15;M.bounty*=.75;} },
  { id:'cryorounds', name:'Cryo Rounds', kind:'trade', desc:'Every hit briefly slows enemies by 20%, but towers deal 12% less damage.', apply:M=>{M.hitSlow=.2;M.dmg*=.88;} },
  { id:'hardened', name:'Hardened Foes', kind:'trade', desc:'Enemies gain +3 armor, but wave-clear bonus is +60 gold.', apply:M=>{M.armor+=3;M.waveBonus+=60;} },
  { id:'blood', name:'Blood Pact', kind:'trade', desc:'Lose 6 lives. All towers deal +22% damage.', apply:M=>{S.lives=Math.max(1,S.lives-6);M.dmg*=1.22;}, ok:()=>S.lives>8 },
  { id:'area', name:'Area Doctrine', kind:'trade', desc:'Mortar splash +35% and Tesla +2 chains, but Repeater and Lance deal 20% less damage.', apply:M=>{M.splash*=1.35;M.chains+=2;M.typeDmg.gatling=.8;M.typeDmg.lance=.8;} },
  { id:'adrenal', name:'Adrenaline Tide', kind:'trade', desc:'Enemies move 12% faster, but every tower cools 25% faster and kills pay +20%.', apply:M=>{M.enemySpeed*=1.12;M.cool*=1.25;M.bounty*=1.2;} }
];
const MODES = ['First', 'Last', 'Strong', 'Close'];

/* ---------- state ---------- */
let S, screen = 'menu', buildType = null, sel = null, hoverBuild = null, mouse = { x: -1, y: -1, in: false }, shiftKey = false;
function newState(){
  return { phase:'build', wave:0, gold:250, lives:20, towers:[], enemies:[], bullets:[], shells:[], bolts:[], rings:[], parts:[], texts:[], burns:[],
    spawnQ:[], waveT:0, mods:[], M:baseMods(), offer:null, shake:0, time:0, speed:1, grid:new Map(), nextId:1, kills:0, leaked:0,
    banner:null, leakFlash:0, endT:0, modT:0, endWin:false, over:false, modsVer:0, goldEarned:0 };
}

function eff(type, level){
  const l = TOWERS[type].lv[level], M = S.M, dm = M.dmg * (M.typeDmg[type] || 1);
  return { dmg:(l.dmg||0)*dm, dps:(l.dps||0)*dm*M.rate, rate:(l.rate||0)*M.rate, range:l.range*M.range, min:l.min||0,
    splash:(l.splash||0)*M.splash, heat:l.heat*M.heat*(type==='lance'?M.rate:1), chains:(l.chains||0)+(type==='tesla'?M.chains:0),
    slow:l.slow||0, slowDur:l.slowDur||0, brittle:l.brittle||0, pierce:l.pierce||0, burn:(l.burn||0)*dm, stun:l.stun||0, ramp:l.ramp||1 };
}
const towerCost = k => Math.round(TOWERS[k].cost * S.M.cost);
const upgCost = t => t.level >= 2 ? Infinity : Math.round(TOWERS[t.type].upg[t.level] * S.M.cost);
const sellValue = t => Math.floor(t.invested * S.M.refund);

/* ---------- effects ---------- */
function floatText(x, y, txt, color, size = 12, life = .9){ if (S.texts.length > 140) S.texts.shift(); S.texts.push({ x, y, txt, color, size, life, max:life }); }
function burst(x, y, color, n, spd = 120, size = 3, life = .5){
  for (let i = 0; i < n; i++){ if (S.parts.length > 700) S.parts.shift(); const a = Math.random()*Math.PI*2, v = spd*rand(.3,1);
    S.parts.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:life*rand(.6,1.2), max:life, size:size*rand(.6,1.3), color, drag:3, grav:0 }); }
}
function steam(t){ S.parts.push({ x:t.x+rand(-10,10), y:t.y-6, vx:rand(-10,10), vy:rand(-50,-25), life:rand(.6,1), max:1, size:rand(3,6), color:'#c9ccd3', drag:1, grav:-10, smoke:true }); }
function ring(x, y, r0, r1, color, life = .4, w = 3){ S.rings.push({ x, y, r0, r1, color, life, max:life, w }); }
function banner(txt, sub = '', life = 2.4){ S.banner = { txt, sub, life, max:life }; }
function dmgText(e, d, blocked){
  if (d < .5) return;
  const big = d >= 45;
  floatText(e.x + rand(-6,6), e.y - e.d.r - 4, Math.round(d), blocked ? '#8d97a8' : big ? '#ffd84a' : '#ffffff', big ? 15 : blocked ? 10 : 11, .7);
}

/* ---------- enemies ---------- */
function spawnEnemy(type, dist = 0, hpm){
  const d = ENEMIES[type]; if (hpm == null) hpm = waveHp(S.wave);
  const mh = d.hp * (d.boss ? 1 : hpm) * S.M.enemyHp;
  const e = { id:S.nextId++, type, d, hp:mh, maxHp:mh, hpm, dist, speed:d.speed, armor:d.armor, off:d.boss ? 0 : rand(-7,7),
    slow:0, slowT:0, brittle:0, brittleT:0, stun:0, flash:0, alive:true, x:0, y:0, ang:0, healCd:1, spawnCd:5, enraged:false,
    dmgAcc:0, dmgAccT:0, wob:Math.random()*6.28 };
  placeE(e); S.enemies.push(e); return e;
}
function placeE(e){ const p = posAt(e.dist); e.x = p.x - p.dy * e.off; e.y = p.y + p.dx * e.off; e.ang = Math.atan2(p.dy, p.dx); }
function curSpeed(e){ return e.stun > 0 ? 0 : e.speed * S.M.enemySpeed * (1 - e.slow) * (e.enraged ? 1.5 : 1); }
function applySlow(e, amt, dur){ if (e.d.boss) amt *= .6; if (amt >= e.slow){ e.slow = amt; e.slowT = Math.max(e.slowT, dur); } }
function hurt(e, amt, o = {}){
  if (!e.alive) return 0;
  let d = amt;
  if (!o.trueDmg){ const ar = Math.max(0, e.armor + S.M.armor - (o.pierce || 0)); d = Math.max(amt * .15, amt - ar); }
  if (e.brittleT > 0) d *= 1 + e.brittle;
  e.hp -= d; e.flash = Math.max(e.flash, o.silent ? .05 : .1);
  if (o.src) o.src.dmgDone += d;
  if (S.M.hitSlow && !o.noSlow) applySlow(e, S.M.hitSlow, .6);
  if (o.silent) e.dmgAcc += d; else dmgText(e, d, d < amt * .5);
  if (e.hp <= 0) kill(e, o.src);
  return d;
}
function kill(e, src){
  e.alive = false; S.kills++; if (src) src.kills++;
  const g = Math.max(1, Math.round(e.d.bounty * S.M.bounty)); S.gold += g; S.goldEarned += g;
  floatText(e.x, e.y - 14, '+' + g, '#f5c542', 12, 1);
  burst(e.x, e.y, e.d.color, e.d.boss ? 80 : 10 + e.d.r, e.d.boss ? 260 : 130, e.d.boss ? 5 : 3);
  if (e.d.split){
    ring(e.x, e.y, 4, 30, '#d17cff', .35);
    for (let i = 0; i < e.d.split; i++){ const m = spawnEnemy('mite', Math.max(0, e.dist - 10 + i * 10), e.hpm); m.off = clamp(e.off + rand(-8,8), -10, 10); placeE(m); }
  }
  if (e.d.boss){ S.shake = 18; ring(e.x, e.y, 10, 160, '#ff5d6c', .9, 6); banner('COLOSSUS DESTROYED', 'Finish off the stragglers!', 2.5); }
}
function updateEnemy(e, dt){
  if (e.stun > 0) e.stun -= dt;
  e.dist += curSpeed(e) * dt;
  if ((e.slowT -= dt) <= 0) e.slow = 0;
  if ((e.brittleT -= dt) <= 0) e.brittle = 0;
  e.flash -= dt;
  if (e.dmgAcc > 0 && (e.dmgAccT -= dt) <= 0){ dmgText(e, e.dmgAcc, false); e.dmgAcc = 0; e.dmgAccT = .3; }
  if (e.d.heal && (e.healCd -= dt) <= 0){
    e.healCd = 1.5; let healed = false;
    for (const o of S.enemies){
      if (o === e || !o.alive || o.hp >= o.maxHp || dist2(o, e) > 85 * 85) continue;
      const amt = o.d.boss ? 40 : Math.min(o.maxHp * .08, 20 * o.hpm);
      o.hp = Math.min(o.maxHp, o.hp + amt); healed = true;
      floatText(o.x, o.y - o.d.r - 6, '+' + Math.round(amt), '#5fd38d', 10, .6);
    }
    if (healed) ring(e.x, e.y, 6, 85, '#5fd38d', .5, 2);
  }
  if (e.d.boss){
    if (!e.enraged && e.hp < e.maxHp * .5){ e.enraged = true; S.shake = 10; banner('COLOSSUS ENRAGED', 'It moves faster and spawns more Mites', 2); ring(e.x, e.y, 10, 120, '#ff5d6c', .6, 5); }
    if ((e.spawnCd -= dt) <= 0){
      e.spawnCd = e.enraged ? 3 : 5;
      for (let i = 0; i < 2; i++){ const m = spawnEnemy('mite', Math.max(0, e.dist - 30 - i * 12), waveHp(S.wave)); m.off = rand(-10, 10); placeE(m); }
      ring(e.x, e.y, 8, 50, '#ecb8ff', .4);
    }
  }
  if (e.dist >= PATH_LEN){ leak(e); return; }
  placeE(e);
}
function leak(e){
  e.alive = false; S.leaked += Math.min(e.d.leak, S.lives); S.lives = Math.max(0, S.lives - e.d.leak);
  S.shake = Math.max(S.shake, e.d.boss ? 18 : 7); S.leakFlash = .5;
  floatText(W - 40, WP[WP.length-1].y - 22, '−' + e.d.leak + ' ♥', '#ff5d6c', 16, 1.2);
  if (S.lives <= 0 && !S.over){ S.over = true; S.endT = 1.4; S.endWin = false; banner('THE GATE HAS FALLEN', '', 2); }
}

/* ---------- towers ---------- */
function canPlace(c, r){ return c >= 0 && c < COLS && r >= 0 && r < ROWS && !pathTile.has(c + ',' + r) && !S.grid.has(c + ',' + r); }
function neighbors(c, r, skip){ const out = []; for (const t of S.towers) if (t !== skip && Math.abs(t.c - c) <= 1 && Math.abs(t.r - r) <= 1 && !(t.c === c && t.r === r)) out.push(t); return out; }
function coolFor(c, r, skip){ let f = 1, nb = 0, cn = 0; for (const o of neighbors(c, r, skip)){ if (o.type === 'cryo'){ f += .35; cn++; } else { f -= .15; nb++; } } return { f:Math.max(.35, f), nb, cn }; }
function recalcCool(){ for (const t of S.towers){ const k = coolFor(t.c, t.r, t); t.coolF = k.f; t.nb = k.nb; t.cn = k.cn; } }
function placeTower(type, c, r){
  const cost = towerCost(type);
  if (S.over || !canPlace(c, r) || S.gold < cost) return null;
  S.gold -= cost;
  const t = { id:S.nextId++, type, c, r, x:c*T+T/2, y:r*T+T/2, level:0, invested:cost, heat:0, over:false, since:9, cd:0, ang:-Math.PI/2,
    mode:type === 'lance' ? 2 : 0, lock:0, beam:null, firing:false, recoil:0, pulse:0, coolF:1, nb:0, cn:0, kills:0, dmgDone:0, barrel:0, born:0 };
  S.towers.push(t); S.grid.set(c + ',' + r, t); recalcCool();
  burst(t.x, t.y + 8, '#b59a6e', 14, 90, 3, .5); ring(t.x, t.y, 6, 26, TOWERS[type].color, .35);
  return t;
}
function upgradeTower(t){
  const c = upgCost(t); if (S.over || t.level >= 2 || S.gold < c) return false;
  S.gold -= c; t.invested += c; t.level++;
  ring(t.x, t.y, 8, 34, '#ffd84a', .45, 3); burst(t.x, t.y, '#ffd84a', 18, 120, 2.5, .5);
  floatText(t.x, t.y - 26, 'LEVEL ' + (t.level + 1), '#ffd84a', 12, 1);
  return true;
}
function sellTower(t){
  const v = sellValue(t); S.gold += v;
  S.towers = S.towers.filter(o => o !== t); S.grid.delete(t.c + ',' + t.r); recalcCool();
  floatText(t.x, t.y - 16, '+' + v, '#f5c542', 13, 1); burst(t.x, t.y, '#8b95a7', 20, 110, 3, .6);
  if (sel === t) sel = null;
}
function inRange(t, e, st){ const d = dist2(t, e); return d <= (st.range + e.d.r * .5) ** 2 && (!st.min || d >= st.min * st.min); }
function pickTarget(t, st){
  let best = null, bv = -Infinity;
  for (const e of S.enemies){
    if (!e.alive || !inRange(t, e, st)) continue;
    const v = t.mode === 0 ? e.dist : t.mode === 1 ? -e.dist : t.mode === 2 ? e.hp : -dist2(t, e);
    if (v > bv){ bv = v; best = e; }
  }
  return best;
}
function addHeat(t, h){
  t.heat += h; t.since = 0;
  if (t.heat >= 100){ t.heat = 100; t.over = true; t.lock = 0; t.beam = null; t.firing = false;
    floatText(t.x, t.y - 26, 'OVERHEAT!', '#ff7a45', 12, 1.1); for (let i = 0; i < 8; i++) steam(t); }
}
function updateTower(t, dt){
  const st = eff(t.type, t.level);
  t.since += dt; t.cd -= dt; t.recoil = Math.max(0, t.recoil - dt * 6); t.pulse = Math.max(0, t.pulse - dt); t.born += dt;
  const cool = TOWERS[t.type].cool * t.coolF * S.M.cool * (t.since > .6 ? 2.2 : 1) * (t.over ? 1.5 : 1);
  t.heat = Math.max(0, t.heat - cool * dt);
  t.firing = false;
  if (t.over){
    if (t.heat <= 30){ t.over = false; floatText(t.x, t.y - 24, 'READY', '#8fe8ff', 10, .8); }
    else { if (Math.random() < dt * 12) steam(t); return; }
  }
  if (t.type === 'lance') return updateLance(t, st, dt);
  if (t.cd > 0) return;
  if (t.type === 'cryo'){
    const hits = S.enemies.filter(e => e.alive && inRange(t, e, st));
    if (!hits.length) return;
    t.cd = 1 / st.rate; t.pulse = .35;
    for (const e of hits){
      applySlow(e, st.slow, st.slowDur);
      if (st.brittle){ e.brittle = st.brittle; e.brittleT = st.slowDur; }
      hurt(e, st.dmg, { src:t, noSlow:true });
    }
    ring(t.x, t.y, 10, st.range, '#9fefff', .45, 3);
    addHeat(t, st.heat); return;
  }
  const tg = pickTarget(t, st); if (!tg) return;
  t.ang = Math.atan2(tg.y - t.y, tg.x - t.x); t.cd = 1 / st.rate; t.recoil = 1;
  const mx = t.x + Math.cos(t.ang) * 16, my = t.y + Math.sin(t.ang) * 16;
  if (t.type === 'gatling'){
    t.barrel = (t.barrel + 1) % (t.level + 1);
    S.bullets.push({ x:mx, y:my, tg, dmg:st.dmg, pierce:st.pierce, spd:720, src:t });
    S.parts.push({ x:mx, y:my, vx:0, vy:0, life:.05, max:.05, size:5, color:'#fff3b0', drag:0, grav:0 });
  } else if (t.type === 'mortar'){
    const d = Math.hypot(tg.x - t.x, tg.y - t.y), dur = .55 + d / 450;
    const p = posAt(tg.dist + curSpeed(tg) * dur * .6);
    const tx = p.x - p.dy * tg.off, ty = p.y + p.dx * tg.off;
    S.shells.push({ sx:mx, sy:my, tx, ty, t:0, dur, dmg:st.dmg, splash:st.splash, burn:st.burn, src:t });
    burst(mx, my, '#d9d2c5', 6, 60, 3, .4);
  } else if (t.type === 'tesla'){
    const hit = [tg]; let cur = tg;
    while (hit.length < st.chains){
      let best = null, bd = 85 * 85;
      for (const e of S.enemies){ if (!e.alive || hit.includes(e)) continue; const d = dist2(cur, e); if (d < bd){ bd = d; best = e; } }
      if (!best) break; hit.push(best); cur = best;
    }
    const pts = [{ x:t.x, y:t.y - 12 }, ...hit.map(e => ({ x:e.x, y:e.y }))];
    S.bolts.push({ pts, life:.18, max:.18, seed:Math.random() * 1000 });
    hit.forEach((e, i) => { hurt(e, st.dmg * Math.pow(.85, i), { src:t }); if (i === 0 && st.stun && !e.d.boss) e.stun = Math.max(e.stun, st.stun); burst(e.x, e.y, '#d8c8ff', 4, 90, 2, .3); });
  }
  addHeat(t, st.heat);
}
function updateLance(t, st, dt){
  let tg = t.beam;
  if (!(tg && tg.alive && inRange(t, tg, st))){ tg = pickTarget(t, st); t.lock = 0; t.beam = tg; }
  if (!tg) return;
  t.lock += dt * st.ramp; t.ang = Math.atan2(tg.y - t.y, tg.x - t.x); t.firing = true;
  const mult = Math.min(4, 1 + t.lock);
  hurt(tg, st.dps * mult * dt, { src:t, trueDmg:true, silent:true });
  if (Math.random() < dt * 20) S.parts.push({ x:tg.x + rand(-4,4), y:tg.y + rand(-4,4), vx:rand(-60,60), vy:rand(-60,60), life:.25, max:.25, size:2.5, color:'#ff9ccd', drag:2, grav:0 });
  addHeat(t, st.heat * dt);
}

/* ---------- projectiles ---------- */
function updateProjectiles(dt){
  for (const b of S.bullets){
    if (!b.tg.alive){ b.dead = true; continue; }
    const dx = b.tg.x - b.x, dy = b.tg.y - b.y, d = Math.hypot(dx, dy), step = b.spd * dt;
    if (d <= step + b.tg.d.r * .6){
      hurt(b.tg, b.dmg, { src:b.src, pierce:b.pierce }); b.dead = true;
      burst(b.x + dx, b.y + dy, '#ffe28a', 3, 80, 2, .2);
    } else { b.x += dx / d * step; b.y += dy / d * step; b.a = Math.atan2(dy, dx); }
  }
  S.bullets = S.bullets.filter(b => !b.dead);
  for (const s of S.shells){
    s.t += dt;
    if (s.t >= s.dur){
      s.dead = true;
      for (const e of S.enemies.slice()){
        if (!e.alive) continue; const d = Math.hypot(e.x - s.tx, e.y - s.ty);
        if (d <= s.splash + e.d.r * .5) hurt(e, s.dmg * (1 - .5 * clamp(d / s.splash, 0, 1)), { src:s.src });
      }
      ring(s.tx, s.ty, 6, s.splash, '#ffb36b', .35, 4); burst(s.tx, s.ty, '#ff9a3c', 18, 170, 3.5, .45); burst(s.tx, s.ty, '#6b5a48', 8, 70, 5, .7);
      S.shake = Math.max(S.shake, 2.5);
      if (s.burn) S.burns.push({ x:s.tx, y:s.ty, r:s.splash * .8, life:2.5, max:2.5, dps:s.burn, src:s.src });
    }
  }
  S.shells = S.shells.filter(s => !s.dead);
  for (const b of S.burns){
    b.life -= dt;
    for (const e of S.enemies) if (e.alive && dist2(e, b) <= b.r * b.r) hurt(e, b.dps * dt, { src:b.src, silent:true, noSlow:true });
    if (Math.random() < dt * 14) S.parts.push({ x:b.x + rand(-b.r, b.r) * .7, y:b.y + rand(-b.r, b.r) * .7, vx:0, vy:rand(-40,-20), life:.5, max:.5, size:rand(2,4), color:Math.random() < .5 ? '#ff7a2a' : '#ffcc4a', drag:1, grav:0 });
  }
  S.burns = S.burns.filter(b => b.life > 0);
}

/* ---------- waves & modifiers ---------- */
function startWave(){
  if (S.phase !== 'build' || screen || S.over || S.modT > 0 || S.wave >= WAVES.length) return;
  S.wave++; S.phase = 'wave'; S.waveT = 0;
  S.spawnQ = [];
  for (const g of WAVES[S.wave - 1]) for (let i = 0; i < g.n; i++) S.spawnQ.push({ t:g.d + i * g.i, type:g.t });
  S.spawnQ.sort((a, b) => a.t - b.t);
  banner('WAVE ' + S.wave, S.wave === 10 ? 'The Colossus is coming' : waveSummary(S.wave - 1), 2);
}
function waveSummary(i){
  const c = {}; for (const g of WAVES[i]) c[g.t] = (c[g.t] || 0) + g.n;
  return Object.entries(c).map(([k, n]) => n + ' ' + ENEMIES[k].name + (n > 1 && k !== 'boss' ? 's' : '')).join(' · ');
}
function waveDone(){
  S.phase = 'build';
  const bonus = 40 + 10 * S.wave + S.M.waveBonus; S.gold += bonus;
  let sub = '+' + bonus + ' gold';
  if (S.M.interest){ const i = Math.min(100, Math.floor(S.gold * S.M.interest)); S.gold += i; sub += ' · +' + i + ' interest'; }
  for (const t of S.towers) t.lock = 0;
  if (S.wave >= WAVES.length){ S.over = true; S.endT = 1.6; S.endWin = true; banner('VICTORY', 'The siege is broken', 2); return; }
  banner('WAVE ' + S.wave + ' CLEARED', sub, 2.2);
  if (S.wave % 3 === 0) S.modT = .9;
}
function offerMods(){
  const taken = new Set(S.mods.map(m => m.id));
  const pool = MODS.filter(m => !taken.has(m.id) && (!m.ok || m.ok()));
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const boons = shuffle(pool.filter(m => m.kind === 'boon')), trades = shuffle(pool.filter(m => m.kind === 'trade'));
  const pick = [];
  if (boons.length) pick.push(boons.shift());
  while (pick.length < 3 && trades.length) pick.push(trades.shift());
  while (pick.length < 3 && boons.length) pick.push(boons.shift());
  S.offer = shuffle(pick);
  openScreen('choose', `<h2>Choose a Modifier</h2><p>Every 3 waves the battlefield shifts. Pick one; it lasts for the rest of the game.</p>
    <div class="mcards">${S.offer.map((m, i) => `<div class="mcard" data-mod="${i}"><div class="tag ${m.kind}">${m.kind === 'boon' ? 'Boon' : 'Trade-off'}</div>
    <div class="nm">${m.name}</div><div class="ds">${m.desc}</div><div class="ky">Press <kbd>${i + 1}</kbd></div></div>`).join('')}</div>`);
}
function chooseMod(i){
  if (!S.offer || !S.offer[i]) return;
  const m = S.offer[i]; m.apply(S.M); S.mods.push(m); S.offer = null; S.modsVer++;
  recalcCool(); closeScreen(); banner(m.name.toUpperCase(), m.desc, 2.6);
}

/* ---------- main update ---------- */
function update(dt){
  S.time += dt;
  if (S.phase === 'wave'){
    S.waveT += dt;
    while (S.spawnQ.length && S.spawnQ[0].t <= S.waveT){
      const s = S.spawnQ.shift(); const e = spawnEnemy(s.type);
      if (s.type === 'boss'){ S.shake = 12; banner('THE COLOSSUS APPROACHES', 'Armor 10 · Spawns Mites · Enrages at 50%', 3); ring(e.x + 20, e.y, 10, 90, '#ff5d6c', .8, 5); }
    }
  }
  for (const e of S.enemies) if (e.alive) updateEnemy(e, dt);
  for (const t of S.towers) updateTower(t, dt);
  updateProjectiles(dt);
  S.enemies = S.enemies.filter(e => e.alive);
  for (const p of S.parts){ p.life -= dt; p.vx *= 1 - p.drag * dt; p.vy *= 1 - p.drag * dt; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  S.parts = S.parts.filter(p => p.life > 0);
  for (const x of S.texts){ x.life -= dt; x.y -= 28 * dt; }
  S.texts = S.texts.filter(x => x.life > 0);
  for (const r of S.rings) r.life -= dt; S.rings = S.rings.filter(r => r.life > 0);
  for (const b of S.bolts) b.life -= dt; S.bolts = S.bolts.filter(b => b.life > 0);
  S.shake = Math.max(0, S.shake - dt * 30); S.leakFlash = Math.max(0, S.leakFlash - dt);
  if (S.banner && (S.banner.life -= dt) <= 0) S.banner = null;
  if (S.phase === 'wave' && !S.spawnQ.length && !S.enemies.length && !S.over) waveDone();
  if (S.modT > 0 && (S.modT -= dt) <= 0 && !S.over) offerMods();
  if (S.over && S.endT > 0 && (S.endT -= dt) <= 0) showEnd(S.endWin);
}

/* =====================================================================
   RENDERING
   ===================================================================== */
function drawBG(){
  bgCanvas.width = Math.round(W * RES); bgCanvas.height = Math.round(H * RES);
  const g = bgCanvas.getContext('2d'); g.setTransform(RES, 0, 0, RES, 0, 0);
  const rnd = mulberry32(1337);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
    const l = 20 + rnd() * 3.5 + ((r + c) % 2 ? 1.2 : 0);
    g.fillStyle = `hsl(${96 + rnd() * 10},32%,${l}%)`; g.fillRect(c * T, r * T, T, T);
  }
  for (let i = 0; i < 420; i++){
    const x = rnd() * W, y = rnd() * H;
    if (pathTile.has(Math.floor(x / T) + ',' + Math.floor(y / T))) continue;
    const k = rnd();
    if (k < .82){ g.strokeStyle = `hsla(${90 + rnd() * 30},40%,${rnd() < .5 ? 14 : 32}%,.7)`; g.lineWidth = 1.2; g.beginPath();
      for (let j = 0; j < 3; j++){ g.moveTo(x + j * 2, y); g.lineTo(x + j * 2 + rnd() * 3 - 1.5, y - 3 - rnd() * 4); } g.stroke(); }
    else if (k < .93){ g.fillStyle = ['#e9e27a', '#f2f2f2', '#d58cff', '#ff9aa6'][Math.floor(rnd() * 4)]; g.beginPath(); g.arc(x, y, 1.6, 0, 7); g.fill(); }
    else { g.fillStyle = 'rgba(40,44,40,.55)'; g.beginPath(); g.ellipse(x, y, 3 + rnd() * 3, 2 + rnd() * 2, 0, 0, 7); g.fill(); }
  }
  g.lineJoin = 'round'; g.lineCap = 'round';
  const trace = () => { g.beginPath(); WP.forEach((p, i) => i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)); };
  trace(); g.strokeStyle = 'rgba(0,0,0,.28)'; g.lineWidth = 42; g.stroke();
  trace(); g.strokeStyle = '#4a3a26'; g.lineWidth = 38; g.stroke();
  trace(); g.strokeStyle = '#8f7048'; g.lineWidth = 33; g.stroke();
  trace(); g.strokeStyle = '#a2835a'; g.lineWidth = 22; g.stroke();
  trace(); g.setLineDash([2, 14]); g.strokeStyle = 'rgba(70,52,30,.35)'; g.lineWidth = 3; g.stroke(); g.setLineDash([]);
  for (let i = 0; i < 260; i++){
    const p = posAt(rnd() * PATH_LEN), o = rnd() * 28 - 14;
    g.fillStyle = rnd() < .5 ? 'rgba(60,45,28,.5)' : 'rgba(200,175,130,.35)';
    g.beginPath(); g.arc(p.x - p.dy * o, p.y + p.dx * o, .8 + rnd() * 1.6, 0, 7); g.fill();
  }
  g.strokeStyle = 'rgba(255,255,255,.035)'; g.lineWidth = 1;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (!pathTile.has(c + ',' + r)) g.strokeRect(c * T + .5, r * T + .5, T - 1, T - 1);
}

function drawTowerBody(g, type, level, x, y, ang, time, recoil = 0, extra = {}){
  const d = TOWERS[type], col = d.color;
  g.save(); g.translate(x, y);
  g.fillStyle = 'rgba(0,0,0,.3)'; rr(g, -16, -13, 34, 32, 7); g.fill();
  g.fillStyle = '#262d3a'; rr(g, -17, -17, 34, 34, 7); g.fill();
  g.strokeStyle = rgba(col, .55); g.lineWidth = 1.5; g.stroke();
  g.fillStyle = '#1b212b'; rr(g, -13, -13, 26, 26, 5); g.fill();
  for (let i = 0; i < 3; i++){ g.fillStyle = i <= level ? '#ffd84a' : 'rgba(255,255,255,.12)'; g.beginPath(); g.arc(-7 + i * 7, 13.5, 1.8, 0, 7); g.fill(); }
  const rc = recoil * 3;
  if (type === 'gatling'){
    g.rotate(ang);
    const n = level + 1, sp = 4;
    for (let i = 0; i < n; i++){ const oy = (i - (n - 1) / 2) * sp; g.fillStyle = '#3b3f48'; g.fillRect(2 - rc, oy - 1.6, 16, 3.2); g.fillStyle = '#15171c'; g.fillRect(16 - rc, oy - 1.6, 2.5, 3.2); }
    g.fillStyle = shade(col, -.25); g.beginPath(); g.arc(0, 0, 9.5, 0, 7); g.fill();
    g.fillStyle = col; g.beginPath(); g.arc(-1, 0, 7.5, 0, 7); g.fill();
    g.fillStyle = shade(col, .5); g.beginPath(); g.arc(-3, -2.5, 2.5, 0, 7); g.fill();
    if (level >= 2){ g.strokeStyle = '#7a5d10'; g.lineWidth = 1.5; g.beginPath(); g.arc(-1, 0, 5, 0, 7); g.stroke(); }
  } else if (type === 'mortar'){
    g.rotate(ang);
    g.fillStyle = shade(col, -.45); g.beginPath(); g.arc(0, 0, 11.5, 0, 7); g.fill();
    g.fillStyle = shade(col, -.2); rr(g, -2 - rc, -5.5 - level * .7, 16, 11 + level * 1.4, 3); g.fill();
    g.fillStyle = '#1a1410'; g.beginPath(); g.ellipse(13 - rc, 0, 2.5, 4.5 + level * .6, 0, 0, 7); g.fill();
    g.fillStyle = col; g.beginPath(); g.arc(-1, 0, 7.5, 0, 7); g.fill();
    for (let i = 0; i <= level; i++){ g.strokeStyle = '#4a2a10'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(4 + i * 3.5 - rc, -5.5 - level * .7); g.lineTo(4 + i * 3.5 - rc, 5.5 + level * .7); g.stroke(); }
  } else if (type === 'cryo'){
    const pulse = extra.pulse || 0;
    if (pulse > 0){ g.fillStyle = rgba('#9fefff', pulse * .8); g.beginPath(); g.arc(0, 0, 14 + pulse * 10, 0, 7); g.fill(); }
    g.rotate(time * .7);
    g.fillStyle = shade(col, -.5); poly(g, 6, 12.5); g.fill();
    const grd = g.createLinearGradient(-10, -10, 10, 10); grd.addColorStop(0, '#e8fdff'); grd.addColorStop(1, col);
    g.fillStyle = grd; poly(g, 6, 10); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 1.3; g.beginPath();
    for (let i = 0; i < 3 + level; i++){ const a = i * Math.PI * 2 / (3 + level); g.moveTo(0, 0); g.lineTo(Math.cos(a) * 8, Math.sin(a) * 8); } g.stroke();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(0, 0, 2.2, 0, 7); g.fill();
  } else if (type === 'lance'){
    g.rotate(ang);
    g.fillStyle = '#3a2233'; g.fillRect(0, -2, 19, 4);
    g.fillStyle = shade(col, -.4); poly(g, 4, 12); g.fill();
    g.fillStyle = col; poly(g, 4, 8.5); g.fill();
    g.fillStyle = shade(col, .55); g.beginPath(); g.moveTo(0, -8.5); g.lineTo(8.5, 0); g.lineTo(0, 0); g.closePath(); g.fill();
    for (let i = 0; i < level; i++){ g.strokeStyle = '#ffd1e6'; g.lineWidth = 1; g.beginPath(); g.moveTo(9 + i * 4, -2.5); g.lineTo(9 + i * 4, 2.5); g.stroke(); }
    g.fillStyle = extra.firing ? '#fff' : '#ffc2df'; g.beginPath(); g.arc(19, 0, extra.firing ? 3.4 : 2.4, 0, 7); g.fill();
  } else if (type === 'tesla'){
    for (let i = 0; i < level + 2; i++){ g.strokeStyle = i % 2 ? '#c9a86a' : '#8a6d3b'; g.lineWidth = 2; g.beginPath(); g.arc(0, 0, 12 - i * 2.4, 0, 7); g.stroke(); }
    const fl = .75 + .25 * Math.sin(time * 23 + x);
    const grd = g.createRadialGradient(0, 0, 0, 0, 0, 9); grd.addColorStop(0, '#fff'); grd.addColorStop(.4, col); grd.addColorStop(1, rgba(col, 0));
    g.globalAlpha = fl; g.fillStyle = grd; g.beginPath(); g.arc(0, 0, 9, 0, 7); g.fill(); g.globalAlpha = 1;
    g.fillStyle = '#fff'; g.beginPath(); g.arc(0, 0, 2.6, 0, 7); g.fill();
  }
  g.restore();
}

function bodyPath(g, e, r){
  const t = S.time;
  switch (e.type){
    case 'runner': g.beginPath(); g.moveTo(r * 1.25, 0); g.lineTo(-r * .9, -r * .85); g.lineTo(-r * .45, 0); g.lineTo(-r * .9, r * .85); g.closePath(); break;
    case 'brute': rr(g, -r, -r, r * 2, r * 2, 4); break;
    case 'splitter': g.beginPath(); for (let i = 0; i <= 12; i++){ const a = i / 12 * Math.PI * 2, rr2 = r * (1 + .12 * Math.sin(a * 3 + t * 6 + e.wob)); g.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2); } g.closePath(); break;
    case 'mender': poly(g, 8, r, Math.PI / 8); break;
    case 'boss': g.beginPath(); for (let i = 0; i < 16; i++){ const a = i / 16 * Math.PI * 2, rr2 = i % 2 ? r * .82 : r * 1.08; g.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2); } g.closePath(); break;
    default: g.beginPath(); g.arc(0, 0, r, 0, 7);
  }
}
function drawEnemy(g, e){
  const d = e.d, r = d.r * (e.enraged ? 1.08 : 1);
  g.save(); g.translate(e.x, e.y);
  g.fillStyle = 'rgba(0,0,0,.28)'; g.beginPath(); g.ellipse(2, r * .7, r * .95, r * .4, 0, 0, 7); g.fill();
  const bob = e.type === 'grunt' || e.type === 'mite' ? Math.sin(S.time * 12 + e.wob) * 1.2 : 0;
  g.translate(0, bob);
  if (e.enraged){ g.fillStyle = rgba('#ff3b30', .25 + .15 * Math.sin(S.time * 10)); g.beginPath(); g.arc(0, 0, r * 1.5, 0, 7); g.fill(); }
  if (d.heal){ g.strokeStyle = rgba('#5fd38d', .25 + .2 * Math.sin(S.time * 4 + e.wob)); g.lineWidth = 2; g.beginPath(); g.arc(0, 0, r + 6, 0, 7); g.stroke(); }
  g.save();
  if (e.type !== 'mender' && e.type !== 'grunt' && e.type !== 'mite') g.rotate(e.type === 'boss' ? S.time * .4 : e.ang);
  bodyPath(g, e, r);
  g.fillStyle = e.enraged ? '#ff3b30' : d.color; g.fill();
  g.lineWidth = 2; g.strokeStyle = shade(d.color, -.5); g.stroke();
  if (e.type === 'brute'){
    g.fillStyle = shade(d.color, -.25); rr(g, -r * .65, -r * .65, r * 1.3, r * 1.3, 3); g.fill();
    g.fillStyle = '#e4e8ef'; for (const [px, py] of [[-.72,-.72],[.72,-.72],[-.72,.72],[.72,.72]]){ g.beginPath(); g.arc(px * r, py * r, 1.6, 0, 7); g.fill(); }
    g.fillStyle = '#ff6b3d'; g.fillRect(r * .35, -r * .3, 3, r * .6);
  } else if (e.type === 'runner'){
    g.strokeStyle = rgba('#dff6ff', .6); g.lineWidth = 1.5; g.beginPath(); g.moveTo(-r * 1.2, -3); g.lineTo(-r * 2, -3); g.moveTo(-r * 1.2, 3); g.lineTo(-r * 2.1, 3); g.stroke();
    g.fillStyle = '#0d2233'; g.beginPath(); g.arc(r * .35, 0, 2, 0, 7); g.fill();
  } else if (e.type === 'splitter'){
    g.fillStyle = shade(d.color, .4); for (let i = 0; i < 3; i++){ const a = i * 2.09 + S.time * 1.5; g.beginPath(); g.arc(Math.cos(a) * r * .4, Math.sin(a) * r * .4, r * .22, 0, 7); g.fill(); }
  } else if (e.type === 'boss'){
    g.fillStyle = shade(d.color, -.35); poly(g, 8, r * .62, S.time * -.8); g.fill();
    g.fillStyle = e.enraged ? '#fff1a8' : '#ffb36b'; g.beginPath(); g.arc(0, 0, r * .3, 0, 7); g.fill();
  }
  g.restore();
  if (e.type === 'grunt' || e.type === 'mite'){
    const fx = Math.cos(e.ang) * r * .35, fy = Math.sin(e.ang) * r * .35;
    g.fillStyle = '#fff'; for (const s of [-1, 1]){ g.beginPath(); g.arc(fx - Math.sin(e.ang) * s * r * .35, fy + Math.cos(e.ang) * s * r * .35, r * .22, 0, 7); g.fill(); }
    g.fillStyle = '#111'; for (const s of [-1, 1]){ g.beginPath(); g.arc(fx * 1.35 - Math.sin(e.ang) * s * r * .35, fy * 1.35 + Math.cos(e.ang) * s * r * .35, r * .11, 0, 7); g.fill(); }
  } else if (e.type === 'mender'){
    g.fillStyle = '#fff'; g.fillRect(-2, -r * .55, 4, r * 1.1); g.fillRect(-r * .55, -2, r * 1.1, 4);
  }
  if (e.flash > 0){
    g.save(); if (e.type !== 'mender' && e.type !== 'grunt' && e.type !== 'mite') g.rotate(e.type === 'boss' ? S.time * .4 : e.ang);
    bodyPath(g, e, r); g.fillStyle = `rgba(255,255,255,${clamp(e.flash / .1, 0, 1) * .75})`; g.fill(); g.restore();
  }
  if (e.slow > 0){
    g.strokeStyle = rgba('#aef4ff', .85); g.lineWidth = 2; g.beginPath(); g.arc(0, 0, r + 3, 0, 7); g.stroke();
    g.fillStyle = '#e6fcff'; for (let i = 0; i < 3; i++){ const a = i * 2.09 + e.wob; g.fillRect(Math.cos(a) * (r + 3) - 1.5, Math.sin(a) * (r + 3) - 1.5, 3, 3); }
  }
  if (e.brittle > 0){ g.strokeStyle = 'rgba(255,255,255,.5)'; g.setLineDash([2, 3]); g.beginPath(); g.arc(0, 0, r + 6, 0, 7); g.stroke(); g.setLineDash([]); }
  if (e.stun > 0){ g.strokeStyle = '#fff59a'; g.lineWidth = 1.5; for (let i = 0; i < 3; i++){ const a = S.time * 9 + i * 2.1; g.beginPath(); g.moveTo(Math.cos(a) * r, -r - 4 + Math.sin(a) * 3); g.lineTo(Math.cos(a) * r + 3, -r - 7 + Math.sin(a) * 3); g.stroke(); } }
  g.restore();
  if (!d.boss && e.hp < e.maxHp){
    const w = Math.max(18, r * 2), f = clamp(e.hp / e.maxHp, 0, 1), y = e.y - r - 9 + bob;
    g.fillStyle = 'rgba(0,0,0,.65)'; g.fillRect(e.x - w / 2 - 1, y - 1, w + 2, 5);
    g.fillStyle = f > .5 ? '#5fd38d' : f > .25 ? '#ffc94a' : '#ff5d5d'; g.fillRect(e.x - w / 2, y, w * f, 3);
    if (e.armor + S.M.armor > 0){ g.fillStyle = '#c8d0dd'; g.fillRect(e.x - w / 2 - 5, y - 1, 3, 5); }
  }
}

function drawHeat(g, t){
  if (t.heat < 1 && !t.over) return;
  const f = t.heat / 100;
  g.lineWidth = 3; g.strokeStyle = 'rgba(0,0,0,.55)'; g.beginPath(); g.arc(t.x, t.y, 20, 0, 7); g.stroke();
  g.strokeStyle = t.over ? `rgba(255,${60 + 60 * Math.sin(S.time * 14)},40,1)` : heatColor(f);
  g.beginPath(); g.arc(t.x, t.y, 20, -Math.PI / 2, -Math.PI / 2 + f * Math.PI * 2); g.stroke();
  if (t.over){
    g.fillStyle = `rgba(255,60,30,${.18 + .1 * Math.sin(S.time * 14)})`; rr(g, t.x - 17, t.y - 17, 34, 34, 7); g.fill();
    g.font = 'bold 9px system-ui,sans-serif'; g.textAlign = 'center'; g.fillStyle = '#fff'; g.strokeStyle = 'rgba(120,20,10,.9)'; g.lineWidth = 3;
    g.strokeText('HOT', t.x, t.y - 21); g.fillText('HOT', t.x, t.y - 21);
  } else if (f > .75){
    g.fillStyle = `rgba(255,90,40,${(f - .75) * .9})`; rr(g, t.x - 17, t.y - 17, 34, 34, 7); g.fill();
  }
}

function drawRange(g, x, y, st, col, valid = true){
  const c = valid ? col : '#ff5d5d';
  g.fillStyle = rgba(c.startsWith('#') ? c : '#ffffff', .09); g.beginPath(); g.arc(x, y, st.range, 0, 7); g.fill();
  g.save(); g.setLineDash([7, 6]); g.lineDashOffset = -performance.now() / 60; g.strokeStyle = rgba(c, .75); g.lineWidth = 1.6; g.beginPath(); g.arc(x, y, st.range, 0, 7); g.stroke();
  if (st.min){ g.strokeStyle = 'rgba(255,93,93,.8)'; g.fillStyle = 'rgba(255,93,93,.08)'; g.beginPath(); g.arc(x, y, st.min, 0, 7); g.fill(); g.stroke(); }
  g.restore();
}

function render(){
  const g = ctx;
  g.setTransform(RES, 0, 0, RES, 0, 0);
  g.fillStyle = '#0a0d12'; g.fillRect(0, 0, W, H);
  g.save();
  if (S.shake > 0) g.translate(rand(-1, 1) * S.shake * .5, rand(-1, 1) * S.shake * .5);
  g.drawImage(bgCanvas, 0, 0, W, H);
  const now = performance.now() / 1000;

  // portal & gate
  const a = WP[1], z = WP[WP.length - 2];
  g.save(); g.translate(8, a.y);
  for (let i = 0; i < 3; i++){ g.strokeStyle = rgba('#b18cff', .5 - i * .12); g.lineWidth = 3; g.beginPath(); g.ellipse(0, 0, 10 + i * 5 + Math.sin(now * 3 + i) * 2, 20 + i * 4, 0, 0, 7); g.stroke(); }
  g.fillStyle = 'rgba(40,10,60,.8)'; g.beginPath(); g.ellipse(0, 0, 9, 18, 0, 0, 7); g.fill(); g.restore();
  g.save(); g.translate(W - 10, z.y);
  g.fillStyle = '#5b6273'; g.fillRect(-12, -30, 22, 60); g.fillStyle = '#737b8e'; for (let i = 0; i < 4; i++) g.fillRect(-14, -34 + i * 18, 26, 4);
  g.fillStyle = '#20150c'; rr(g, -8, -14, 18, 28, 3); g.fill();
  const lf = clamp(S.lives / 20, 0, 1); g.fillStyle = lerpC('#ff3b30', '#5ec8ff', lf); g.beginPath(); g.arc(0, -40, 5 + Math.sin(now * 3), 0, 7); g.fill();
  g.restore();

  // burns
  for (const b of S.burns){ const al = clamp(b.life / b.max, 0, 1); const grd = g.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    grd.addColorStop(0, `rgba(255,140,40,${.45 * al})`); grd.addColorStop(1, 'rgba(255,60,20,0)'); g.fillStyle = grd; g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.fill(); }

  // placement tile hints
  const mc = Math.floor(mouse.x / T), mr = Math.floor(mouse.y / T);
  if (buildType && mouse.in){
    g.fillStyle = 'rgba(255,255,255,.035)';
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (canPlace(c, r)) g.fillRect(c * T + 2, r * T + 2, T - 4, T - 4);
  }
  // selected range under towers
  if (sel) drawRange(g, sel.x, sel.y, eff(sel.type, sel.level), TOWERS[sel.type].color);

  // towers
  for (const t of S.towers){
    const jit = t.over ? rand(-.8, .8) : 0;
    drawTowerBody(g, t.type, t.level, t.x + jit, t.y, t.ang, S.time, t.recoil, { pulse:t.pulse, firing:t.firing });
    if (t === sel){ g.strokeStyle = '#fff'; g.lineWidth = 2; rr(g, t.x - 19, t.y - 19, 38, 38, 8); g.stroke(); }
  }
  // enemies
  const order = S.enemies.slice().sort((p, q) => p.d.r - q.d.r);
  for (const e of order) drawEnemy(g, e);

  // beams
  for (const t of S.towers){
    if (!t.firing || !t.beam) continue;
    const tg = t.beam, mult = Math.min(4, 1 + t.lock), sx = t.x + Math.cos(t.ang) * 19, sy = t.y + Math.sin(t.ang) * 19;
    g.save(); g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
    g.strokeStyle = rgba('#ff4fa3', .25 + .08 * Math.sin(now * 40)); g.lineWidth = 5 + mult * 2.2; g.beginPath(); g.moveTo(sx, sy); g.lineTo(tg.x, tg.y); g.stroke();
    g.strokeStyle = rgba('#ff8cc6', .7); g.lineWidth = 2 + mult * .7; g.stroke();
    g.strokeStyle = '#fff'; g.lineWidth = 1.2; g.stroke();
    g.fillStyle = rgba('#ffc2df', .6); g.beginPath(); g.arc(tg.x, tg.y, 4 + mult * 1.5, 0, 7); g.fill();
    g.restore();
  }
  // bullets
  g.fillStyle = '#ffe28a';
  for (const b of S.bullets){ g.save(); g.translate(b.x, b.y); g.rotate(b.a || 0); g.fillStyle = 'rgba(255,226,138,.35)'; g.fillRect(-9, -1, 9, 2); g.fillStyle = '#fff4c2'; g.fillRect(-2, -1.5, 5, 3); g.restore(); }
  // shells
  for (const s of S.shells){
    const k = s.t / s.dur, x = s.sx + (s.tx - s.sx) * k, y = s.sy + (s.ty - s.sy) * k, h = Math.sin(k * Math.PI) * (40 + s.dur * 30);
    g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(x, y, 4, 2, 0, 0, 7); g.fill();
    g.strokeStyle = rgba('#ff8a3c', .35 * (1 - k)); g.lineWidth = 1; g.beginPath(); g.arc(s.tx, s.ty, s.splash * (1 - k * .3), 0, 7); g.stroke();
    g.fillStyle = '#2b2522'; g.beginPath(); g.arc(x, y - h, 4.5 + Math.sin(k * Math.PI) * 1.5, 0, 7); g.fill();
    g.fillStyle = '#ffb36b'; g.beginPath(); g.arc(x - 1, y - h - 1, 1.5, 0, 7); g.fill();
  }
  // bolts
  for (const b of S.bolts){
    const al = b.life / b.max, rnd = mulberry32(Math.floor(b.seed + now * 30));
    g.save(); g.globalCompositeOperation = 'lighter'; g.lineJoin = 'round';
    for (const [w, c] of [[6, rgba('#b18cff', .35 * al)], [2, rgba('#efe6ff', al)]]){
      g.strokeStyle = c; g.lineWidth = w; g.beginPath();
      for (let i = 0; i < b.pts.length - 1; i++){ const p = b.pts[i], q = b.pts[i + 1]; if (i === 0) g.moveTo(p.x, p.y);
        const n = 5; for (let j = 1; j <= n; j++){ const f = j / n, ox = j < n ? (rnd() - .5) * 14 : 0, oy = j < n ? (rnd() - .5) * 14 : 0; g.lineTo(p.x + (q.x - p.x) * f + ox, p.y + (q.y - p.y) * f + oy); } }
      g.stroke();
    }
    g.restore();
  }
  // heat rings on top
  for (const t of S.towers) drawHeat(g, t);
  // rings
  for (const r of S.rings){ const k = 1 - r.life / r.max; g.strokeStyle = rgba(r.color.startsWith('#') ? r.color : '#ffffff', (1 - k) * .8); g.lineWidth = r.w * (1 - k) + .5; g.beginPath(); g.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * k, 0, 7); g.stroke(); }
  // particles
  for (const p of S.parts){ const al = clamp(p.life / p.max, 0, 1);
    if (p.smoke){ g.fillStyle = `rgba(200,204,211,${al * .45})`; g.beginPath(); g.arc(p.x, p.y, p.size * (2 - al), 0, 7); g.fill(); }
    else { g.globalAlpha = al; g.fillStyle = p.color; g.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); g.globalAlpha = 1; } }
  // floating texts
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const x of S.texts){ const al = clamp(x.life / x.max * 1.6, 0, 1); g.globalAlpha = al; g.font = `bold ${x.size}px system-ui,sans-serif`;
    g.strokeStyle = 'rgba(0,0,0,.75)'; g.lineWidth = 3; g.strokeText(x.txt, x.x, x.y); g.fillStyle = x.color; g.fillText(x.txt, x.x, x.y); }
  g.globalAlpha = 1;

  // placement ghost
  if (buildType && mouse.in && !S.over){
    const ok = canPlace(mc, mr) && S.gold >= towerCost(buildType), cx = mc * T + T / 2, cy = mr * T + T / 2;
    const st = eff(buildType, 0);
    drawRange(g, cx, cy, st, TOWERS[buildType].color, ok);
    if (mc >= 0 && mc < COLS && mr >= 0 && mr < ROWS){
      if (canPlace(mc, mr)){
        g.globalAlpha = .7; drawTowerBody(g, buildType, 0, cx, cy, -Math.PI / 2, S.time); g.globalAlpha = 1;
        const k = coolFor(mc, mr, null);
        for (const o of neighbors(mc, mr, null)){
          const good = o.type === 'cryo';
          g.strokeStyle = good ? '#7fe3ff' : '#ff9a3c'; g.lineWidth = 2; g.setLineDash([3, 3]); rr(g, o.x - 18, o.y - 18, 36, 36, 7); g.stroke(); g.setLineDash([]);
          if (!good && buildType !== 'cryo'){ g.font = 'bold 10px system-ui'; g.fillStyle = '#ff9a3c'; g.fillText('−15%', o.x, o.y + 25); }
          if (buildType === 'cryo' && !good){ g.font = 'bold 10px system-ui'; g.fillStyle = '#7fe3ff'; g.fillText('+35%', o.x, o.y + 25); }
        }
        const pct = Math.round(k.f * 100), txt = 'Cooling ' + pct + '%';
        g.font = 'bold 11px system-ui'; const w = g.measureText(txt).width + 12;
        g.fillStyle = 'rgba(10,13,18,.85)'; rr(g, cx - w / 2, cy + 22, w, 17, 5); g.fill();
        g.fillStyle = pct > 100 ? '#7fe3ff' : pct < 100 ? '#ff9a3c' : '#c5cbd6'; g.fillText(txt, cx, cy + 31);
      } else {
        g.fillStyle = 'rgba(255,60,60,.25)'; g.fillRect(mc * T, mr * T, T, T);
      }
    }
  }
  g.restore();

  // boss bar
  const boss = S.enemies.find(e => e.d.boss);
  if (boss){
    const w = 420, x = (W - w) / 2, y = 14, f = clamp(boss.hp / boss.maxHp, 0, 1);
    g.fillStyle = 'rgba(8,10,14,.8)'; rr(g, x - 6, y - 4, w + 12, 30, 7); g.fill();
    g.fillStyle = '#301316'; g.fillRect(x, y + 10, w, 10);
    g.fillStyle = boss.enraged ? '#ff3b30' : '#ff5d6c'; g.fillRect(x, y + 10, w * f, 10);
    g.fillStyle = 'rgba(255,255,255,.4)'; g.fillRect(x + w / 2 - 1, y + 10, 2, 10);
    g.font = 'bold 10px system-ui'; g.textAlign = 'left'; g.fillStyle = '#ffd0d4'; g.fillText('COLOSSUS' + (boss.enraged ? ' — ENRAGED' : ''), x, y + 3);
    g.textAlign = 'right'; g.fillText(Math.ceil(boss.hp) + ' / ' + Math.round(boss.maxHp), x + w, y + 3);
  }
  // leak vignette
  if (S.leakFlash > 0){
    const grd = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .85);
    grd.addColorStop(0, 'rgba(255,0,0,0)'); grd.addColorStop(1, `rgba(255,30,30,${S.leakFlash * .7})`); g.fillStyle = grd; g.fillRect(0, 0, W, H);
  }
  // banner
  if (S.banner){
    const b = S.banner, k = 1 - b.life / b.max, al = Math.min(1, k * 6, b.life * 2.5), sc = 1 + Math.max(0, .25 - k * 1.5);
    g.save(); g.globalAlpha = al; g.translate(W / 2, H * .28); g.scale(sc, sc); g.textAlign = 'center';
    g.font = '900 40px system-ui,sans-serif'; g.lineWidth = 7; g.strokeStyle = 'rgba(0,0,0,.7)'; g.strokeText(b.txt, 0, 0); g.fillStyle = '#fff'; g.fillText(b.txt, 0, 0);
    if (b.sub){ g.font = '600 15px system-ui,sans-serif'; g.lineWidth = 4; g.strokeText(b.sub, 0, 32); g.fillStyle = '#ffd98a'; g.fillText(b.sub, 0, 32); }
    g.restore();
  }
  if (S.speed > 1 && !screen){ g.font = 'bold 12px system-ui'; g.textAlign = 'right'; g.fillStyle = 'rgba(255,255,255,.6)'; g.fillText('▶▶ ' + S.speed + '×', W - 12, H - 12); }
}

/* =====================================================================
   UI
   ===================================================================== */
const ov = $('ov'), ovCard = $('ovCard'), infoEl = $('info');
function openScreen(name, html){ screen = name; ovCard.innerHTML = html; ov.classList.remove('hidden'); }
function closeScreen(){ screen = null; ov.classList.add('hidden'); }
function menuHTML(){
  return `<h1>THERMAL SIEGE</h1><p>Hold the gate for 10 waves. Your towers get hot, so spread them out or they'll shut down.</p>
  <div class="cols">
   <div><b>🔥 Heat</b>Towers heat up every time they fire. At 100% they shut down until they cool to 30%. Each adjacent non-Cryo tower cuts cooling by 15%. Each adjacent <span style="color:#7fe3ff">Cryo Spire</span> adds 35%.</div>
   <div><b>🎲 Modifiers</b>After waves 3, 6 and 9 you pick one of three global modifiers. Some are pure boons. Others are trade-offs that can make or break a build.</div>
   <div><b>⌨ Controls</b><kbd>1</kbd>–<kbd>5</kbd> build · click to place (<kbd>Shift</kbd> keeps building)<br><kbd>U</kbd> upgrade · <kbd>S</kbd> sell · <kbd>T</kbd> targeting<br><kbd>Space</kbd> next wave · <kbd>F</kbd> speed · <kbd>P</kbd> pause · right-click cancels</div>
  </div>
  <p style="font-size:13px;color:#8b95a7">Every enemy type needs its own answer. Armor laughs at the Repeater, Runners outpace Mortar shells, and Splitters punish single-target builds.</p>
  <button class="big" data-act="start">Start Game</button>`;
}
function showEnd(win){
  const mods = S.mods.map(m => m.name).join(', ') || 'none';
  openScreen(win ? 'win' : 'lose', `<h2 style="color:${win ? '#5fd38d' : '#ff5d6c'}">${win ? 'Victory!' : 'Defeat'}</h2>
    <p>${win ? 'The Colossus has fallen and the gate still stands.' : 'The enemy broke through on wave ' + S.wave + '.'}</p>
    <div class="sgrid"><div><b>${S.wave}/10</b><span>Wave</span></div><div><b style="color:#ff5d6c">${S.lives}</b><span>Lives left</span></div>
    <div><b>${S.kills}</b><span>Kills</span></div><div><b style="color:#f5c542">${S.goldEarned}</b><span>Bounty earned</span></div></div>
    <p style="font-size:13px;color:#8b95a7">Modifiers: ${mods}</p>
    <button class="big" data-act="restart">Play Again</button><button class="big alt" data-act="menu">Main Menu</button>`);
}
function togglePause(){
  if (screen === 'pause'){ closeScreen(); return; }
  if (screen) return;
  openScreen('pause', `<h2>Paused</h2><p>Take a breath. The enemy waits.</p>
    <button class="big" data-act="resume">Resume</button><button class="big alt" data-act="restart">Restart</button><button class="big alt" data-act="menu">Main Menu</button>`);
}
function startGame(){ S = newState(); sel = null; buildType = null; closeScreen(); lastSig = ''; lastMods = -1; banner('PREPARE YOUR DEFENSES', 'Build towers, then press Space to start wave 1', 3); }
function toMenu(){ S = newState(); sel = null; buildType = null; openScreen('menu', menuHTML()); }

ov.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'), m = e.target.closest('[data-mod]');
  if (m) return chooseMod(+m.dataset.mod);
  if (!a) return;
  const act = a.dataset.act;
  if (act === 'start' || act === 'restart') startGame();
  else if (act === 'resume') closeScreen();
  else if (act === 'menu') toMenu();
});

function buildButtons(){
  const b = $('build'); b.innerHTML = '';
  for (const k of TKEYS){
    const d = TOWERS[k], btn = document.createElement('button');
    btn.className = 'tb'; btn.dataset.type = k; btn.title = d.name;
    const c = document.createElement('canvas'); c.width = 84; c.height = 84; c.style.width = '42px'; c.style.height = '42px';
    const g = c.getContext('2d'); g.scale(2, 2);
    btn.innerHTML = `<span class="key">${d.key}</span>`; btn.append(c);
    const cs = document.createElement('span'); cs.className = 'cost'; btn.append(cs);
    btn.addEventListener('click', () => selectBuild(k));
    btn.addEventListener('mouseenter', () => { hoverBuild = k; });
    btn.addEventListener('mouseleave', () => { hoverBuild = null; });
    b.append(btn);
    btn._g = g;
  }
}
function drawButtonIcons(){ for (const btn of $('build').children){ const g = btn._g; g.clearRect(0, 0, 42, 42); drawTowerBody(g, btn.dataset.type, 0, 21, 21, -Math.PI / 4, performance.now() / 1000); } }
function selectBuild(k){ if (!S || screen) return; sel = null; buildType = buildType === k ? null : k; }

const R = x => Math.round(x), F1 = x => Math.round(x * 10) / 10;
function statLines(type, a, b){
  const A = eff(type, a), B = b == null ? null : eff(type, b), out = [];
  const add = (k, fn) => out.push([k, fn(A), B ? fn(B) : null]);
  switch (type){
    case 'gatling': add('Damage', s => R(s.dmg)); add('Fire rate', s => F1(s.rate) + '/s'); add('Range', s => R(s.range)); if (B || A.pierce) add('Armor pierce', s => s.pierce || '—'); break;
    case 'mortar': add('Damage', s => R(s.dmg)); add('Splash', s => R(s.splash)); add('Fire rate', s => F1(s.rate) + '/s'); add('Range', s => R(s.min) + '–' + R(s.range)); if (B || A.burn) add('Napalm', s => s.burn ? R(s.burn) + ' dps' : '—'); break;
    case 'cryo': add('Slow', s => R(s.slow * 100) + '%'); add('Pulse damage', s => R(s.dmg)); add('Pulse rate', s => F1(s.rate) + '/s'); add('Range', s => R(s.range)); break;
    case 'lance': add('Beam DPS', s => R(s.dps) + '→' + R(s.dps * 4)); add('Ramp time', s => F1(3 / s.ramp) + 's'); add('Range', s => R(s.range)); break;
    case 'tesla': add('Damage', s => R(s.dmg)); add('Chain targets', s => s.chains); add('Fire rate', s => F1(s.rate) + '/s'); add('Range', s => R(s.range)); break;
  }
  add(type === 'lance' ? 'Heat / sec' : 'Heat / shot', s => F1(s.heat));
  return out;
}
const tbl = rows => `<table class="st">${rows.map(([k, a, b]) => `<tr><td>${k}</td><td>${a}${b != null && b !== a ? ` <span class="up">→ ${b}</span>` : ''}</td></tr>`).join('')}</table>`;

let lastSig = '', lastMods = -1;
function infoSig(){
  if (sel) return `t${sel.id}|${sel.level}|${S.gold >= upgCost(sel)}|${sel.mode}|${S.modsVer}|${sellValue(sel)}`;
  const k = hoverBuild || buildType; if (k) return `b${k}|${S.modsVer}|${S.gold >= towerCost(k)}`;
  return 'guide';
}
function infoHTML(){
  if (sel){
    const t = sel, d = TOWERS[t.type], nxt = t.level < 2 ? t.level + 1 : null, uc = upgCost(t);
    return `<div class="ih"><span class="dot" style="background:${d.color}"></span><b>${d.name}</b><span class="lvl">${'★'.repeat(t.level + 1)}${'☆'.repeat(2 - t.level)}</span></div>
      ${tbl(statLines(t.type, t.level, nxt))}
      ${t.level === 2 ? `<div class="perk">✦ ${d.perk}</div>` : `<div class="perk dimp">Lv3: ${d.perk}</div>`}
      <div class="heat"><div class="hb"><div class="hf" id="iHeat"></div></div><span id="iHeatT"></span></div>
      <div class="dim" id="iCool"></div><div class="dim" id="iDmg"></div>
      <div class="btns">
        <button class="btn" data-act="upg" ${nxt == null || S.gold < uc ? 'disabled' : ''}>${nxt == null ? 'Max level' : 'Upgrade'}<small>${nxt == null ? '—' : uc + 'g · U'}</small></button>
        <button class="btn sell" data-act="sell">Sell<small>+${sellValue(t)}g · S</small></button>
        ${t.type !== 'cryo' ? `<button class="btn" data-act="mode">Target<small>${MODES[t.mode]} · T</small></button>` : ''}
      </div>`;
  }
  const k = hoverBuild || buildType;
  if (k){
    const d = TOWERS[k];
    return `<div class="ih"><span class="dot" style="background:${d.color}"></span><b>${d.name}</b><span class="lvl" style="color:${S.gold >= towerCost(k) ? '#f5c542' : '#ff5d5d'}">${towerCost(k)}g</span></div>
      <div class="role">${d.role}</div>${tbl(statLines(k, 0, null))}
      <div class="gw"><b style="color:#5fd38d">Strong:</b> ${d.good}</div><div class="gw"><b style="color:#ff8a8a">Weak:</b> ${d.weak}</div>
      <div class="perk dimp" style="margin-top:5px">Lv3: ${d.perk}</div>`;
  }
  return `<div class="ih"><b>Field Guide</b></div><div class="eg">${['grunt','runner','brute','splitter','mender','boss'].map(k =>
    `<span class="dot" style="background:${ENEMIES[k].color}"></span><div><b>${ENEMIES[k].name}</b> <span style="color:#8b95a7">${ENEMIES[k].info}</span></div>`).join('')}</div>
    <div class="dim" style="margin-top:8px">Towers that fire nonstop overheat. Spread them out, or pack them around a Cryo Spire.</div>`;
}
function uiTick(){
  $('sGold').textContent = Math.floor(S.gold);
  $('sLives').textContent = S.lives;
  $('sWave').textContent = S.wave + '/10';
  for (const btn of $('build').children){
    const k = btn.dataset.type, c = towerCost(k);
    btn.querySelector('.cost').textContent = c;
    btn.classList.toggle('on', buildType === k);
    btn.classList.toggle('poor', S.gold < c);
  }
  const sig = infoSig();
  if (sig !== lastSig){ lastSig = sig; infoEl.innerHTML = infoHTML(); }
  if (sel){
    const hf = $('iHeat'), ht = $('iHeatT'), ic = $('iCool'), id = $('iDmg');
    if (hf){ hf.style.width = sel.heat + '%'; hf.style.background = sel.over ? '#ff3b30' : heatColor(sel.heat / 100);
      ht.textContent = sel.over ? 'OVERHEAT' : 'Heat ' + Math.round(sel.heat) + '%'; ht.style.color = sel.over ? '#ff5d5d' : '#c5cbd6';
      const cp = Math.round(sel.coolF * S.M.cool * 100);
      ic.innerHTML = `Cooling <b style="color:${cp > 100 ? '#7fe3ff' : cp < 100 ? '#ff9a3c' : '#e6e9ef'}">${cp}%</b> · ${sel.nb} hot neighbour${sel.nb === 1 ? '' : 's'}${sel.cn ? `, ${sel.cn} cryo` : ''}`;
      id.textContent = `Damage dealt ${Math.round(sel.dmgDone)} · Kills ${sel.kills}`; }
  }
  if (lastMods !== S.modsVer){
    lastMods = S.modsVer;
    $('mods').innerHTML = S.mods.length ? S.mods.map(m => `<span class="chip ${m.kind}" title="${m.desc}">${m.name}</span>`).join('') : '<span class="chip none">None yet · first pick after wave 3</span>';
  }
  const nx = $('next');
  if (S.wave < WAVES.length){
    const nw = S.phase === 'wave' ? S.wave : S.wave + 1;
    nx.innerHTML = S.phase === 'wave'
      ? `<b>Wave ${S.wave}</b> in progress · ${S.enemies.length + S.spawnQ.length} enemies left${S.wave < 10 ? `<br><span class="dim">Next: ${waveSummary(S.wave)}</span>` : ''}`
      : `<b>Next: Wave ${nw}</b>${nw === 10 ? ' · <span style="color:#ff5d6c">BOSS</span>' : ''}<br>${waveSummary(nw - 1)}`;
  } else nx.innerHTML = S.phase === 'wave' ? `<b>Final wave</b> · ${S.enemies.length + S.spawnQ.length} enemies left` : '<b>All waves cleared!</b>';
  const bw = $('bWave');
  bw.disabled = S.phase !== 'build' || S.over || S.wave >= WAVES.length;
  bw.textContent = S.phase === 'wave' ? 'Wave in progress…' : S.wave >= WAVES.length ? 'Done' : `Start Wave ${S.wave + 1}  ␣`;
  $('bSpeed').textContent = S.speed + '×';
  $('bPause').textContent = screen === 'pause' ? '▶' : '❚❚';
}

$('panel').addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || !S || screen) return;
  const act = a.dataset.act;
  if (act === 'upg' && sel) upgradeTower(sel);
  else if (act === 'sell' && sel) sellTower(sel);
  else if (act === 'mode' && sel) sel.mode = (sel.mode + 1) % MODES.length;
});
$('bWave').addEventListener('click', () => startWave());
$('bSpeed').addEventListener('click', () => { if (S) S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 3 : 1; });
$('bPause').addEventListener('click', () => { if (S && (!screen || screen === 'pause')) togglePause(); });

/* ---------- input ---------- */
function toCanvas(ev){ const r = cvs.getBoundingClientRect(); return { x:(ev.clientX - r.left) / r.width * W, y:(ev.clientY - r.top) / r.height * H }; }
cvs.addEventListener('mousemove', ev => { const p = toCanvas(ev); mouse.x = p.x; mouse.y = p.y; mouse.in = true; });
cvs.addEventListener('mouseleave', () => { mouse.in = false; });
cvs.addEventListener('contextmenu', ev => { ev.preventDefault(); buildType = null; sel = null; });
cvs.addEventListener('mousedown', ev => {
  if (ev.button !== 0 || screen || !S) return;
  const p = toCanvas(ev), c = Math.floor(p.x / T), r = Math.floor(p.y / T);
  const t = S.grid.get(c + ',' + r);
  if (buildType){
    if (t){ sel = t; buildType = null; return; }
    if (!canPlace(c, r)) return;
    if (S.gold < towerCost(buildType)){ floatText(p.x, p.y - 10, 'Not enough gold', '#ff5d5d', 12, .9); return; }
    const nt = placeTower(buildType, c, r);
    if (nt && !(ev.shiftKey || shiftKey)){ buildType = null; sel = nt; }
    return;
  }
  sel = t || null;
});
addEventListener('keydown', ev => {
  shiftKey = ev.shiftKey;
  const k = ev.key;
  if (k === ' ') ev.preventDefault();
  if (!S) return;
  if (screen === 'menu'){ if (k === 'Enter' || k === ' ') startGame(); return; }
  if (screen === 'choose'){ if (k >= '1' && k <= '3') chooseMod(+k - 1); return; }
  if (screen === 'win' || screen === 'lose'){ if (k === 'Enter' || k === 'r' || k === 'R') startGame(); return; }
  if (k === 'p' || k === 'P' || (k === 'Escape' && !buildType && !sel)){ togglePause(); return; }
  if (screen) return;
  if (k === 'Escape'){ buildType = null; sel = null; return; }
  const ti = TKEYS.findIndex(x => TOWERS[x].key === k);
  if (ti >= 0){ selectBuild(TKEYS[ti]); return; }
  if (k === ' ' || k === 'n' || k === 'N') startWave();
  else if (k === 'f' || k === 'F') S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 3 : 1;
  else if (sel && (k === 'u' || k === 'U')) upgradeTower(sel);
  else if (sel && (k === 's' || k === 'S')) sellTower(sel);
  else if (sel && (k === 't' || k === 'T') && sel.type !== 'cryo') sel.mode = (sel.mode + 1) % MODES.length;
});
addEventListener('keyup', ev => { shiftKey = ev.shiftKey; });
addEventListener('blur', () => { if (S && !screen && S.wave > 0) togglePause(); });

/* ---------- loop ---------- */
function fit(){
  const s = Math.min(innerWidth / 1240, innerHeight / 640) * .98;
  $('wrap').style.transform = `translate(-50%,-50%) scale(${s})`;
  RES = clamp(s * (window.devicePixelRatio || 1), 1, 3);
  cvs.width = Math.round(W * RES); cvs.height = Math.round(H * RES);
  drawBG();
}
addEventListener('resize', fit);
const STEP = 1 / 60; let last = performance.now(), acc = 0, uiAcc = 0, iconAcc = 0;
function frame(now){
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (!screen && !S.over || (S.over && S.endT > 0 && !screen)){
    acc += dt * S.speed; let n = 0;
    while (acc >= STEP && n < 10){ update(STEP); acc -= STEP; n++; }
    if (n >= 10) acc = 0;
  }
  render();
  if ((uiAcc += dt) > .08){ uiAcc = 0; uiTick(); }
  if ((iconAcc += dt) > .1){ iconAcc = 0; drawButtonIcons(); }
  requestAnimationFrame(frame);
}

S = newState();
buildButtons(); fit(); uiTick();
openScreen('menu', menuHTML());
requestAnimationFrame(frame);

// hook for automated testing
window.TD = { get S(){ return S; }, startGame, startWave, placeTower, upgradeTower, sellTower, chooseMod, update, WAVES, TOWERS, ENEMIES, eff, get screen(){ return screen; } };
</script>
</body>
</html>

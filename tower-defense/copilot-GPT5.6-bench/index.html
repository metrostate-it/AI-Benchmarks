<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overheat Defense</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07111d;color:#eef6ff;font:14px system-ui}canvas{display:block;margin:auto;max-width:100%;background:#10291e;cursor:crosshair}</style></head>
<body><canvas id="c" width="1100" height="720"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=c.width,H=c.height;
const path=[[0,115],[180,115],[180,260],[410,260],[410,100],[650,100],[650,400],[850,400],[850,205],[1100,205]];
const TYPES={cannon:{name:'Cannon',cost:110,r:115,rate:1.05,dmg:30,color:'#ffb84d',mechanic:'splash'},frost:{name:'Frost',cost:95,r:110,rate:.8,dmg:5,color:'#62cfff',mechanic:'slow'},rail:{name:'Railgun',cost:145,r:175,rate:.42,dmg:65,color:'#d68cff',mechanic:'pierce'},arc:{name:'Arc',cost:125,r:120,rate:.65,dmg:16,color:'#81ff91',mechanic:'chain'}};
const mods=[['Liquid Cooling','Cooling +35%',()=>G.cool*=1.35],['Hot Loads','Damage +30%, heat +25%',()=>{G.dmg*=1.3;G.heat*=1.25}],['Bounty Hunter','Gold rewards +25%',()=>G.bounty*=1.25],['Long Barrels','Range +20%, fire rate -10%',()=>{G.range*=1.2;G.rate*=.9}],['Rapid Cycling','Fire rate +25%, damage -12%',()=>{G.rate*=1.25;G.dmg*=.88}],['Field Repairs','Gain 5 lives',()=>G.lives+=5]];
let state='start',G,towers,enemies,shots,fx,spawnQ,last=0,selected=null,placing=null,choices=[];
function reset(){G={gold:330,lives:20,wave:0,dmg:1,rate:1,range:1,cool:1,heat:1,bounty:1};towers=[];enemies=[];shots=[];fx=[];spawnQ=[];selected=null;placing=null;state='start'}reset();
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function routeDist(px,py){let best=1e9;for(let i=0;i<path.length-1;i++){let[ax,ay]=path[i],[bx,by]=path[i+1],dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy))),qx=ax+t*dx,qy=ay+t*dy;best=Math.min(best,Math.hypot(px-qx,py-qy))}return best}
function enemy(kind,w,child=false){let z={kind,x:path[0][0],y:path[0][1],pi:1,slow:0,dead:false};let s=kind==='fast'?{hp:34,spd:112,r:9,col:'#ffe26b',armor:0,reward:9}:kind==='armor'?{hp:145,spd:43,r:13,col:'#8fa0b9',armor:.48,reward:20}:kind==='split'?{hp:72,spd:62,r:12,col:'#ef73b5',armor:0,reward:15}:kind==='boss'?{hp:1800,spd:32,r:25,col:'#ff4d55',armor:.25,reward:180}:{hp:55,spd:61,r:11,col:'#ff8b5c',armor:0,reward:11};Object.assign(z,s);z.hp*=1+(w-1)*.16;z.max=z.hp;z.child=child;return z}
function wave(){if(G.wave>=10)return;G.wave++;let n=8+G.wave*2;for(let i=0;i<n;i++){let k=G.wave<2?'basic':G.wave<4?(i%3?'fast':'armor'):(i%4===0?'split':i%3===0?'armor':i%2?'fast':'basic');spawnQ.push({t:i*.62,e:enemy(k,G.wave)})}if(G.wave===10)spawnQ.push({t:n*.63,e:enemy('boss',10)})}
function damage(e,d,t){if(e.dead)return;let dd=d*G.dmg*(t.mechanic==='rail'?1:1-e.armor);e.hp-=dd;fx.push({x:e.x,y:e.y,a:1,col:t.color});if(e.hp<=0){e.dead=true;G.gold+=Math.round(e.reward*G.bounty);if(e.kind==='split'&&!e.child)for(let j=0;j<2;j++){let q=enemy('fast',G.wave,true);q.x=e.x;q.y=e.y;q.pi=e.pi;q.hp=q.max=28*(1+(G.wave-1)*.1);enemies.push(q)}}}
function fire(t,target){t.cd=1/(TYPES[t.type].rate*G.rate*(1+t.lv*.16));t.heat+=22*G.heat;if(t.heat>=100){t.hot=true;t.heat=100}let ty=TYPES[t.type];if(ty.mechanic==='splash'){for(let e of enemies)if(!e.dead&&dist(e,target)<48)damage(e,ty.dmg*(1+t.lv*.35),t);shots.push({x:t.x,y:t.y,tx:target.x,ty:target.y,a:1,col:ty.color})}else if(ty.mechanic==='slow'){damage(target,ty.dmg*(1+t.lv*.3),t);target.slow=Math.max(target.slow,1.8+t.lv*.5);shots.push({x:t.x,y:t.y,tx:target.x,ty:target.y,a:1,col:ty.color})}else if(ty.mechanic==='rail'){let vx=target.x-t.x,vy=target.y-t.y,L=Math.hypot(vx,vy),ux=vx/L,uy=vy/L;for(let e of enemies){let ex=e.x-t.x,ey=e.y-t.y,along=ex*ux+ey*uy,off=Math.abs(ex*uy-ey*ux);if(along>0&&along<ty.r*G.range&&off<15)damage(e,ty.dmg*(1+t.lv*.35),t)}shots.push({x:t.x,y:t.y,tx:t.x+ux*ty.r*G.range,ty:t.y+uy*ty.r*G.range,a:1,col:ty.color})}else{damage(target,ty.dmg*(1+t.lv*.35),t);let near=enemies.filter(e=>!e.dead&&e!==target&&dist(e,target)<80).slice(0,2+t.lv),p=target;for(let e of near){damage(e,ty.dmg*.55,t);shots.push({x:p.x,y:p.y,tx:e.x,ty:e.y,a:1,col:ty.color});p=e}shots.push({x:t.x,y:t.y,tx:target.x,ty:target.y,a:1,col:ty.color})}}
function update(dt){if(state!=='play')return;for(let s of spawnQ)s.t-=dt;while(spawnQ[0]&&spawnQ[0].t<=0)enemies.push(spawnQ.shift().e);for(let e of enemies){if(e.dead)continue;let p=path[e.pi],dx=p[0]-e.x,dy=p[1]-e.y,L=Math.hypot(dx,dy),sp=e.spd*(e.slow>0?.55:1);e.slow-=dt;if(L<sp*dt){e.x=p[0];e.y=p[1];e.pi++;if(e.pi>=path.length){e.dead=true;G.lives-=e.kind==='boss'?10:1;if(G.lives<=0)state='lose'}}else{e.x+=dx/L*sp*dt;e.y+=dy/L*sp*dt}}for(let t of towers){t.cd-=dt;t.heat=Math.max(0,t.heat-dt*18*G.cool);if(t.hot&&t.heat<35)t.hot=false;if(!t.hot&&t.cd<=0){let r=TYPES[t.type].r*G.range*(1+t.lv*.08),targets=enemies.filter(e=>!e.dead&&dist(t,e)<=r);targets.sort((a,b)=>b.pi-a.pi);if(targets[0])fire(t,targets[0])}}enemies=enemies.filter(e=>!e.dead);for(let q of shots)q.a-=dt*4;shots=shots.filter(q=>q.a>0);for(let q of fx)q.a-=dt*2.5;fx=fx.filter(q=>q.a>0);if(!spawnQ.length&&!enemies.length&&G.wave>0){if(G.wave===10)state='win';else if(G.wave%3===0){choices=[...mods].sort(()=>Math.random()-.5).slice(0,3);state='mod'}else state='between'}}
function panel(){x.fillStyle='#091421ef';x.fillRect(0,620,W,100);x.fillStyle='#fff';x.font='bold 18px system-ui';x.fillText('Gold '+G.gold+'   Lives '+G.lives+'   Wave '+G.wave+'/10',18,650);let i=0;for(let k in TYPES){let t=TYPES[k],bx=18+i*142;x.fillStyle=placing===k?'#31506d':'#182a3b';x.fillRect(bx,665,130,40);x.fillStyle=t.color;x.fillText(t.name+' $'+t.cost,bx+8,691);i++}x.fillStyle='#9fb3c8';x.font='13px system-ui';x.fillText('Click tower button, then field. Select tower: U upgrade, S sell. Space: pause.',600,691)}
function button(bx,by,bw,bh,s){x.fillStyle='#36a766';x.fillRect(bx,by,bw,bh);x.fillStyle='#fff';x.font='bold 18px system-ui';x.fillText(s,bx+bw/2-x.measureText(s).width/2,by+34)}
function wrap(s,cx,y,w){x.textAlign='center';let a=s.split(' '),line='';for(let z of a){if(x.measureText(line+z).width>w){x.fillText(line,cx,y);y+=17;line=''}line+=z+' '}x.fillText(line,cx,y);x.textAlign='left'}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#143621';x.fillRect(0,0,W,620);x.strokeStyle='#8d704d';x.lineWidth=58;x.lineJoin='round';x.beginPath();path.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke();x.strokeStyle='#b99a68';x.lineWidth=42;x.stroke();for(let t of towers){let ty=TYPES[t.type];if(t===selected){x.strokeStyle=ty.color+'88';x.lineWidth=2;x.beginPath();x.arc(t.x,t.y,ty.r*G.range*(1+t.lv*.08),0,7);x.stroke()}x.fillStyle='#11202c';x.beginPath();x.arc(t.x,t.y,17,0,7);x.fill();x.fillStyle=ty.color;x.fillRect(t.x-8,t.y-14,16,18);x.fillStyle=t.hot?'#ff473d':'#15212d';x.fillRect(t.x-16,t.y+21,32,5);x.fillStyle=t.hot?'#ff473d':'#ffb34d';x.fillRect(t.x-16,t.y+21,32*t.heat/100,5);x.fillStyle='#fff';x.font='10px system-ui';x.fillText('L'+(t.lv+1),t.x-6,t.y+5)}for(let e of enemies){x.fillStyle=e.col;x.beginPath();x.arc(e.x,e.y,e.r,0,7);x.fill();if(e.kind==='armor'){x.strokeStyle='#e4ebff';x.lineWidth=3;x.stroke()}if(e.kind==='boss'){x.strokeStyle='#ffd65a';x.lineWidth=4;x.stroke()}x.fillStyle='#311';x.fillRect(e.x-16,e.y-e.r-8,32,4);x.fillStyle='#61e66e';x.fillRect(e.x-16,e.y-e.r-8,32*Math.max(0,e.hp/e.max),4)}for(let q of shots){x.globalAlpha=q.a;x.strokeStyle=q.col;x.lineWidth=3;x.beginPath();x.moveTo(q.x,q.y);x.lineTo(q.tx,q.ty);x.stroke()}for(let q of fx){x.strokeStyle=q.col;x.globalAlpha=q.a;x.beginPath();x.arc(q.x,q.y,18*(1-q.a)+4,0,7);x.stroke()}x.globalAlpha=1;panel();if(placing){let ty=TYPES[placing];x.fillStyle='#fff';x.fillText('Placing '+ty.name+' - '+ty.mechanic,600,650)}if(['start','between','pause','win','lose','mod'].includes(state)){x.fillStyle='#04101bd9';x.fillRect(210,115,680,390);x.textAlign='center';x.fillStyle='#fff';x.font='bold 42px system-ui';let ttl=state==='start'?'OVERHEAT DEFENSE':state==='win'?'VICTORY':state==='lose'?'DEFEAT':state==='pause'?'PAUSED':state==='mod'?'CHOOSE A MODIFIER':'WAVE CLEARED';x.fillText(ttl,550,190);x.font='16px system-ui';if(state==='start'){x.fillText('Four tower mechanics • heat management • 10 escalating waves',550,230);x.fillText('Fast enemies reward slowing; armor rewards railguns; splitters punish weak coverage.',550,258);button(445,310,210,55,'START')}else if(state==='between')button(445,300,210,55,'NEXT WAVE');else if(state==='pause')button(445,300,210,55,'RESUME');else if(state==='win'||state==='lose')button(445,300,210,55,'RESTART');else choices.forEach((m,i)=>{x.fillStyle='#18304a';x.fillRect(295+i*175,275,160,110);x.fillStyle='#fff';x.font='bold 15px system-ui';x.fillText(m[0],375+i*175,307);x.font='12px system-ui';wrap(m[1],375+i*175,333,140)});x.textAlign='left'}}
c.onclick=e=>{let r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*W/r.width,my=(e.clientY-r.top)*H/r.height;if(state==='start'){state='between';return}if(state==='between'){state='play';wave();return}if(state==='pause'){state='play';return}if(state==='win'||state==='lose'){reset();return}if(state==='mod'){let idx=Math.floor((mx-295)/175);if(idx>=0&&idx<3&&my>275&&my<385){choices[idx][2]();state='between'}return}if(my>665){let idx=Math.floor((mx-18)/142),ks=Object.keys(TYPES);if(idx>=0&&idx<4)placing=ks[idx];return}if(placing){let ty=TYPES[placing];if(G.gold>=ty.cost&&routeDist(mx,my)>42&&towers.every(t=>Math.hypot(t.x-mx,t.y-my)>30)){G.gold-=ty.cost;towers.push({x:mx,y:my,type:placing,lv:0,cd:0,heat:0,hot:false,spent:ty.cost});placing=null}return}selected=towers.find(t=>dist(t,{x:mx,y:my})<22)||null};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();state=state==='play'?'pause':state==='pause'?'play':state}if(!selected)return;if(e.key.toLowerCase()==='u'&&selected.lv<2){let cost=Math.round(TYPES[selected.type].cost*(.7+selected.lv*.35));if(G.gold>=cost){G.gold-=cost;selected.spent+=cost;selected.lv++}}if(e.key.toLowerCase()==='s'){G.gold+=Math.round(selected.spent*.65);towers=towers.filter(t=>t!==selected);selected=null}});
function loop(ts){let dt=Math.min(.033,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
